  topic: 3. Basic Data Visualization with Matplotlib
  text: You cleaned a column of house prices and want to see whether it is skewed or has outliers. Which plot shows
    that best?
  options:
  - A pie chart of the prices
  - A line plot of the prices in row order
  - A histogram of the prices
  - A bar chart of the first ten prices
  answer: 2
  explanation: A histogram shows how values are distributed, so a long tail or isolated bars stand out.
