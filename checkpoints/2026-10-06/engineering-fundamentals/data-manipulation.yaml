questions:
- id: q1
  topic: 1. NumPy Foundations
  text: After `a = np.arange(12).reshape(3, 4)`, what is `a[1:, ::2].shape`?
  options:
  - (3, 2)
  - (2, 4)
  - (2, 2)
  - (1, 2)
  answer: 2
  explanation: '`1:` keeps rows 1 and 2, and `::2` keeps columns 0 and 2, so two rows by two columns.'
- id: q2
  topic: 2. Pandas & Data Cleaning
  text: The column `df["age"]` has some missing values (NaN). What does `df["age"].mean()` return?
  options:
  - The mean of the values that are present
  - NaN, because a value is missing
  - An error until the missing values are filled
  - The mean with each missing value counted as 0
  answer: 0
  explanation: Pandas skips missing values by default (`skipna=True`), so the mean is taken over the values that
    are present.
- id: q3
  topic: 2. Pandas & Data Cleaning
  text: You want the rows where age is over 30 and the city is Seoul. Which expression does it?
  options:
  - '`df[df["age"] > 30 and df["city"] == "Seoul"]`'
  - '`df[df["age"] > 30, df["city"] == "Seoul"]`'
  - '`df.filter(age > 30, city == "Seoul")`'
  - '`df[(df["age"] > 30) & (df["city"] == "Seoul")]`'
  answer: 3
  explanation: Conditions on columns combine element by element with `&`, and each needs its own parentheses; `and`
    raises an error on a Series.
- id: q4
  topic: 4. SQL
  text: You need the customers with more than five orders. Which query returns them?
  options:
  - '`SELECT customer_id FROM orders WHERE COUNT(*) > 5 GROUP BY customer_id;`'
  - '`SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(*) > 5;`'
  - '`SELECT customer_id, COUNT(*) > 5 FROM orders;`'
  - '`SELECT customer_id FROM orders ORDER BY COUNT(*) > 5;`'
  answer: 1
  explanation: '`WHERE` filters rows before grouping and cannot use an aggregate; `HAVING` filters the groups after
    `GROUP BY`.'
