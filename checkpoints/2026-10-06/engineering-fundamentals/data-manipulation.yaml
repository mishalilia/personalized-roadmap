problem:
  title: Scale each column to 0–1
  prompt: 'Write `min_max_scale(a)` for a 2-D NumPy array: scale each column so that its smallest value becomes
    0 and its largest 1, without a Python loop. A column whose values are all equal becomes all zeros.


    Example: the column `[1, 3, 2]` becomes `[0, 1, 0.5]`.'
  starter_code: "import numpy as np\n\n\ndef min_max_scale(a: np.ndarray) -> np.ndarray:\n    \"\"\"Each column\
    \ scaled to 0..1; a constant column becomes zeros.\"\"\"\n    ..."
  tests: 'import numpy as np


    a = np.array([[1.0, 10.0], [3.0, 10.0], [2.0, 10.0]])

    result = min_max_scale(a)

    assert result.shape == (3, 2), "the shape stays the same"

    assert np.allclose(result[:, 0], [0.0, 1.0, 0.5]), "the first column is scaled"

    assert np.allclose(result[:, 1], 0.0), "a constant column becomes zeros"

    assert np.allclose(min_max_scale(np.array([[0.0], [4.0]]))[:, 0], [0.0, 1.0]), "one column works too"'
  solution: "import numpy as np\n\n\ndef min_max_scale(a):\n    low = a.min(axis=0)\n    span = a.max(axis=0) -\
    \ low\n    return np.divide(a - low, span, out=np.zeros_like(a, dtype=float), where=span != 0)"
  packages:
  - numpy
