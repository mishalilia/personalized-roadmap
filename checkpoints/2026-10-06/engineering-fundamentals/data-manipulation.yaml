  - '7'
  - '2'
  - '10'
  answer: 1
  explanation: The boolean mask keeps 3 and 4, and their sum is 7.
- id: q7
  topic: 2. Pandas & Data Cleaning
  text: Which line gives the average salary in each department?
  options:
  - '`df["salary"].mean()`'
  - '`df.sort_values("department")["salary"].mean()`'
  - '`df[df["department"]]["salary"].mean()`'
