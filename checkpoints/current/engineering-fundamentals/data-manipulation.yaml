- title: Regional Order Summary
  prompt: 'Write `regional_order_summary(conn)` to run a SQL query using the supplied SQLite connection. The database
    has `customers(customer_id, region)` and `orders(order_id, customer_id, status, amount)` tables.


    Return a list of tuples in this order: `(region, customer_count, completed_order_count, completed_revenue, large_completed_order_count)`.
    Include regions with at least two customers even if they have no orders. Count and sum only orders whose status
    is `''completed''`; treat a completed order with a `NULL` amount as zero revenue. A large completed order has
    an amount of at least 100. Sort by completed revenue descending, then region name ascending.


    For example, with the corresponding rows already in `conn`:


    ```python

    regional_order_summary(conn)

    # [(''South'', 2, 2, 180, 1), (''North'', 2, 2, 120, 1),

    #  (''East'', 2, 0, 0, 0), (''West'', 2, 0, 0, 0)]

    ```'
  starter_code: "def regional_order_summary(conn):\n    \"\"\"Run a SQL query and return the regional order summary\
    \ as a list of tuples.\"\"\"\n    ..."
  tests: "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE customers (customer_id\
    \ INTEGER PRIMARY KEY, region TEXT NOT NULL)\")\nconn.execute(\"CREATE TABLE orders (order_id INTEGER PRIMARY\
    \ KEY, customer_id INTEGER, status TEXT, amount INTEGER)\")\nconn.executemany(\n    \"INSERT INTO customers\
    \ VALUES (?, ?)\",\n    [\n        (1, \"North\"), (2, \"North\"),\n        (3, \"South\"), (4, \"South\"),\n\
    \        (5, \"East\"), (6, \"East\"),\n        (7, \"West\"), (8, \"West\"),\n        (9, \"Solo\"),\n    ],\n\
    )\nconn.executemany(\n    \"INSERT INTO orders VALUES (?, ?, ?, ?)\",\n    [\n        (11, 1, \"completed\"\
    , 120),\n        (12, 1, \"completed\", None),\n        (13, 2, \"pending\", 300),\n        (14, 2, \"cancelled\"\
    , 50),\n        (15, 3, \"completed\", 80),\n        (16, 4, \"completed\", 100),\n        (17, 9, \"completed\"\
    , 999),\n    ],\n)\n\nrows = regional_order_summary(conn)\nassert rows == [(\"South\", 2, 2, 180, 1), (\"North\"\
    , 2, 2, 120, 1), (\"East\", 2, 0, 0, 0), (\"West\", 2, 0, 0, 0)], \"include qualifying regions and sort by revenue,\
    \ then region\"\nassert rows[0] == (\"South\", 2, 2, 180, 1), \"count completed orders and include amounts of\
    \ exactly 100 as large\"\nassert rows[1] == (\"North\", 2, 2, 120, 1), \"ignore non-completed orders and count\
    \ NULL completed revenue as zero\"\nassert rows[2:] == [(\"East\", 2, 0, 0, 0), (\"West\", 2, 0, 0, 0)], \"\
    retain regions with no orders and order ties by region name\"\nassert all(row[0] != \"Solo\" for row in rows),\
    \ \"exclude regions with fewer than two customers\"\nassert [row[3] for row in rows] == [180, 120, 0, 0], \"\
    sort completed revenue in descending order\""
  solution: "def regional_order_summary(conn):\n    \"\"\"Run a SQL query and return the regional order summary\
    \ as a list of tuples.\"\"\"\n    query = \"\"\"\n        SELECT\n            c.region,\n            COUNT(DISTINCT\
    \ c.customer_id) AS customer_count,\n            SUM(CASE WHEN o.status = 'completed' THEN 1 ELSE 0 END) AS\
    \ completed_order_count,\n            SUM(CASE WHEN o.status = 'completed' THEN COALESCE(o.amount, 0) ELSE 0\
    \ END) AS completed_revenue,\n            SUM(CASE WHEN o.status = 'completed' AND o.amount >= 100 THEN 1 ELSE\
    \ 0 END) AS large_completed_order_count\n        FROM customers AS c\n        LEFT JOIN orders AS o ON o.customer_id\
    \ = c.customer_id\n        GROUP BY c.region\n        HAVING COUNT(DISTINCT c.customer_id) >= 2\n        ORDER\
    \ BY completed_revenue DESC, c.region ASC\n    \"\"\"\n    return conn.execute(query).fetchall()"
