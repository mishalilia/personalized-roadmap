questions:
- id: q1
  topic: NumPy Foundations
  text: After `a = np.arange(12).reshape(3, 4)`, what is `a[1:, ::2].shape`?
  options:
  - (3, 2)
  - (2, 4)
  - (2, 2)
  - (1, 2)
  answer: 2
  explanation: '`1:` keeps rows 1 and 2, and `::2` keeps columns 0 and 2, so two rows by two columns.'
- id: q2
  topic: Pandas and Data Cleaning
  text: The column `df["age"]` has some missing values (NaN). What does `df["age"].mean()` return?
  options:
  - The mean of the values that are present
  - NaN, because a value is missing
  - An error until the missing values are filled
  - The mean with each missing value counted as 0
  answer: 0
  explanation: Pandas skips missing values by default (`skipna=True`), so the mean is taken over the values that
    are present.
- id: q3
  topic: Pandas and Data Cleaning
  text: You want the rows where age is over 30 and the city is Seoul. Which expression does it?
  options:
  - '`df[df["age"] > 30 and df["city"] == "Seoul"]`'
  - '`df[df["age"] > 30, df["city"] == "Seoul"]`'
  - '`df.filter(age > 30, city == "Seoul")`'
  - '`df[(df["age"] > 30) & (df["city"] == "Seoul")]`'
  answer: 3
  explanation: Conditions on columns combine element by element with `&`, and each needs its own parentheses; `and`
    raises an error on a Series.
- id: q4
  topic: SQL
  text: You need the customers with more than five orders. Which query returns them?
  options:
  - '`SELECT customer_id FROM orders WHERE COUNT(*) > 5 GROUP BY customer_id;`'
  - '`SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(*) > 5;`'
  - '`SELECT customer_id, COUNT(*) > 5 FROM orders;`'
  - '`SELECT customer_id FROM orders ORDER BY COUNT(*) > 5;`'
  answer: 1
  explanation: '`WHERE` filters rows before grouping and cannot use an aggregate; `HAVING` filters the groups after
    `GROUP BY`.'
- id: q5
  topic: Exploratory Analysis and Visualization
  text: You cleaned a column of house prices and want to see whether it is skewed or has outliers. Which plot shows
    that best?
  options:
  - A pie chart of the prices
  - A line plot of the prices in row order
  - A histogram of the prices
  - A bar chart of the first ten prices
  answer: 2
  explanation: A histogram shows how values are distributed, so a long tail or isolated bars stand out.
- id: q6
  topic: NumPy Foundations
  text: What does `a[a > 0].sum()` return for `a = np.array([3, -1, 4, -2])`?
  options:
  - '4'
  - '7'
  - '2'
  - '10'
  answer: 1
  explanation: The boolean mask keeps 3 and 4, and their sum is 7.
- id: q7
  topic: Pandas and Data Cleaning
  text: Which line gives the average salary in each department?
  options:
  - '`df["salary"].mean()`'
  - '`df.sort_values("department")["salary"].mean()`'
  - '`df[df["department"]]["salary"].mean()`'
  - '`df.groupby("department")["salary"].mean()`'
  answer: 3
  explanation: '`groupby` splits the rows by department and `mean` is taken within each group; the others give one
    number for all rows or fail.'
- id: q8
  topic: SQL
  text: You need every customer, including those who never ordered, with their orders where they have any. Which
    join does that?
  options:
  - '`customers LEFT JOIN orders ON customers.id = orders.customer_id`'
  - '`customers INNER JOIN orders ON customers.id = orders.customer_id`'
  - '`orders LEFT JOIN customers ON customers.id = orders.customer_id`'
  - '`customers CROSS JOIN orders`'
  answer: 0
  explanation: A LEFT JOIN keeps every row of the left table, here customers, and fills the order columns with NULL
    where there is no match.
- id: q9
  topic: SQL
  text: Which query returns the three most expensive products?
  options:
  - '`SELECT * FROM products WHERE price = MAX(price) LIMIT 3;`'
  - '`SELECT * FROM products ORDER BY price LIMIT 3;`'
  - '`SELECT * FROM products ORDER BY price DESC LIMIT 3;`'
  - '`SELECT TOP(price, 3) FROM products;`'
  answer: 2
  explanation: Sorting by price in descending order puts the most expensive first, and `LIMIT 3` keeps three rows.
- id: q10
  topic: Exploratory Analysis and Visualization
  text: In a column of incomes, the mean is far larger than the median. What does that most likely tell you?
  options:
  - The distribution is skewed to the right by a few very large values
  - The data has no outliers
  - Half of the incomes are above the mean
  - The column contains missing values
  answer: 0
  explanation: A few very large values pull the mean up but barely move the median, so the distribution has a long
    right tail worth investigating.
problem:
  title: Reshape and Filter Readings
  prompt: "Write `analyze_readings(readings, rows, cols, cutoff)` using NumPy. Treat `readings` as a flat sequence\
    \ of measurements and reshape it into a `rows`-by-`cols` matrix. Return a dictionary with:\n\n- `matrix`: the\
    \ reshaped matrix as a nested list.\n- `row_totals`: the sum of each row, in order.\n- `selected_rows`: the\
    \ rows whose totals are **greater than or equal to** `cutoff`, preserving their order.\n- `column_means`: the\
    \ mean of each column across the **entire** matrix, not just the selected rows.\n\nUse array operations for\
    \ the sums, filtering, and means rather than looping over individual values or rows.\n\nExample:\n```python\n\
    analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 10)\n```\nreturns:\n```python\n{\n    \"matrix\": [[1, 2, 3], [4,\
    \ 5, 6]],\n    \"row_totals\": [6, 15],\n    \"selected_rows\": [[4, 5, 6]],\n    \"column_means\": [2.5, 3.5,\
    \ 4.5]\n}\n```"
  starter_code: "def analyze_readings(readings, rows, cols, cutoff):\n    \"\"\"Reshape readings, summarize rows\
    \ and columns, and select rows by total.\"\"\"\n    ..."
  tests: 'result = analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 10)

    assert result == {"matrix": [[1, 2, 3], [4, 5, 6]], "row_totals": [6, 15], "selected_rows": [[4, 5, 6]], "column_means":
    [2.5, 3.5, 4.5]}, "reshape and summarize the example matrix"


    result = analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 6)

    assert result["selected_rows"] == [[1, 2, 3], [4, 5, 6]], "include rows whose total equals the cutoff"


    result = analyze_readings([1, 9, 2, 8, 1, 1, 3, 2, 3], 3, 3, 10)

    assert result["row_totals"] == [12, 10, 8] and result["selected_rows"] == [[1, 9, 2], [8, 1, 1]], "select qualifying
    rows in their original order"

    assert result["column_means"] == [4.0, 4.0, 2.0], "calculate column means across the full matrix"


    result = analyze_readings([1, 1, 1, 2, 2, 2], 2, 3, 100)

    assert result["selected_rows"] == [], "return an empty selection when no row qualifies"

    assert result["column_means"] == [1.5, 1.5, 1.5], "still calculate means when no rows qualify"


    result = analyze_readings([1, 4, 7], 3, 1, 5)

    assert result["matrix"] == [[1], [4], [7]] and result["row_totals"] == [1, 4, 7], "handle a matrix with one
    column"

    assert result["selected_rows"] == [[7]] and result["column_means"] == [4.0], "filter and summarize a one-column
    matrix"'
  solution: "import numpy as np\n\n\ndef analyze_readings(readings, rows, cols, cutoff):\n    \"\"\"Reshape readings,\
    \ summarize rows and columns, and select rows by total.\"\"\"\n    matrix = np.asarray(readings).reshape(rows,\
    \ cols)\n    row_totals = matrix.sum(axis=1)\n    selected_rows = matrix[row_totals >= cutoff]\n    column_means\
    \ = matrix.mean(axis=0)\n\n    return {\n        \"matrix\": matrix.tolist(),\n        \"row_totals\": row_totals.tolist(),\n\
    \        \"selected_rows\": selected_rows.tolist(),\n        \"column_means\": column_means.tolist(),\n    }"
  packages:
  - numpy
  topic: NumPy Foundations
  wrong_solutions:
