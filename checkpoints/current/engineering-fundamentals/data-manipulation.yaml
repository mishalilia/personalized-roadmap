    \ and `revenue` in that order.\n\nApply these rules in order:\n1. Keep the first row for each `order_id`, removing\
    \ later rows with the same ID.\n2. Convert `quantity` and `unit_price` to numeric values. Treat values that\
    \ cannot be converted as missing, then remove rows where either numeric value is missing.\n3. Strip surrounding\
    \ whitespace from `category` and convert it to title case. Replace missing or blank categories with `\"Unknown\"\
