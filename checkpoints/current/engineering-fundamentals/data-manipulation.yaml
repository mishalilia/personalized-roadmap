- title: Build Histogram Data
  prompt: 'Write `histogram_data(values, edges)` to prepare numerical data for a histogram. Return a dictionary
    with `bins` (a list of dictionaries containing `left`, `right`, and `count`), `underflow` (values below the
    first edge), `overflow` (values above the last edge), and `total` (the number of input values).


    Each bin includes its left edge and excludes its right edge, except the last bin, which includes its right edge.
    Values outside the edge range are not counted in bins, but must be reported as underflow or overflow. Assume
    `edges` contains at least two strictly increasing numbers and `values` contains finite numbers.


    Example:

    ```python

    histogram_data([0, 1, 2, 3, 4], [0, 2, 4])

    # {''bins'': [{''left'': 0, ''right'': 2, ''count'': 2},

    #           {''left'': 2, ''right'': 4, ''count'': 3}],

    #  ''underflow'': 0, ''overflow'': 0, ''total'': 5}

    ```'
  starter_code: "def histogram_data(values, edges):\n    \"\"\"Return histogram bins and counts of values outside\
    \ the edge range.\"\"\"\n    ..."
  tests: 'assert histogram_data([0, 1, 2, 3, 4], [0, 2, 4]) == {''bins'': [{''left'': 0, ''right'': 2, ''count'':
    2}, {''left'': 2, ''right'': 4, ''count'': 3}], ''underflow'': 0, ''overflow'': 0, ''total'': 5}, "Include the
    final edge in the last bin."

    assert histogram_data([-1, 0, 1, 2, 3, 4, 5], [0, 2, 4]) == {''bins'': [{''left'': 0, ''right'': 2, ''count'':
    2}, {''left'': 2, ''right'': 4, ''count'': 3}], ''underflow'': 1, ''overflow'': 1, ''total'': 7}, "Report out-of-range
    values separately."

    assert histogram_data([], [0, 1, 3]) == {''bins'': [{''left'': 0, ''right'': 1, ''count'': 0}, {''left'': 1,
    ''right'': 3, ''count'': 0}], ''underflow'': 0, ''overflow'': 0, ''total'': 0}, "Return zero-count bins for
    empty input."

    assert histogram_data([2, 2, 2], [0, 2, 4]) == {''bins'': [{''left'': 0, ''right'': 2, ''count'': 0}, {''left'':
    2, ''right'': 4, ''count'': 3}], ''underflow'': 0, ''overflow'': 0, ''total'': 3}, "Place a shared boundary
    in the bin on its right."

    assert histogram_data([-2, -1], [0, 1, 2]) == {''bins'': [{''left'': 0, ''right'': 1, ''count'': 0}, {''left'':
    1, ''right'': 2, ''count'': 0}], ''underflow'': 2, ''overflow'': 0, ''total'': 2}, "Count values below the first
    edge as underflow."

    assert histogram_data([2, 3], [0, 1, 2]) == {''bins'': [{''left'': 0, ''right'': 1, ''count'': 0}, {''left'':
    1, ''right'': 2, ''count'': 1}], ''underflow'': 0, ''overflow'': 1, ''total'': 2}, "Count values above the last
    edge as overflow."'
  solution: "def histogram_data(values, edges):\n    bins = [\n        {\"left\": edges[i], \"right\": edges[i +\
    \ 1], \"count\": 0}\n        for i in range(len(edges) - 1)\n    ]\n    underflow = 0\n    overflow = 0\n\n\
    \    for value in values:\n        if value < edges[0]:\n            underflow += 1\n        elif value > edges[-1]:\n\
    \            overflow += 1\n        else:\n            for i in range(len(bins)):\n                is_last_bin\
    \ = i == len(bins) - 1\n                if edges[i] <= value < edges[i + 1] or (is_last_bin and value == edges[i\
    \ + 1]):\n                    bins[i][\"count\"] += 1\n                    break\n\n    return {\n        \"\
    bins\": bins,\n        \"underflow\": underflow,\n        \"overflow\": overflow,\n        \"total\": len(values),\n\
    \    }"
