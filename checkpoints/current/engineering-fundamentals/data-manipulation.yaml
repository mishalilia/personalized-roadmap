    \ returned DataFrame's index.\n\nFor example:\n```python\nimport pandas as pd\n\nclean_sales(pd.DataFrame([\n\
    \    {\"order_id\": 1, \"category\": \"  OFFICE supplies \", \"quantity\": \"2\", \"unit_price\": \"3.5\"}\n\
    ])).to_dict(\"records\")\n# [{'order_id': 1, 'category': 'Office Supplies', 'quantity': 2.0,\n#   'unit_price':\
    \ 3.5, 'revenue': 7.0}]\n```"
  starter_code: "def clean_sales(df):\n    \"\"\"Return deduplicated, normalized sales rows with numeric values\
    \ and revenue.\"\"\"\n    ..."
  tests: "import pandas as pd\n\nexample = pd.DataFrame([\n    {\"order_id\": 1, \"category\": \"  OFFICE supplies\
    \ \", \"quantity\": \"2\", \"unit_price\": \"3.5\"}\n])\nassert clean_sales(example).to_dict(\"records\") ==\
    \ [\n    {\"order_id\": 1, \"category\": \"Office Supplies\", \"quantity\": 2.0, \"unit_price\": 3.5, \"revenue\"\
    : 7.0}\n], \"normalizes categories and calculates revenue\"\n\nrecords = pd.DataFrame([\n    {\"order_id\":\
    \ 8, \"category\": \"Books\", \"quantity\": \"2\", \"unit_price\": \"4\"},\n    {\"order_id\": 8, \"category\"\
    : \"Toys\", \"quantity\": \"9\", \"unit_price\": \"9\"},\n    {\"order_id\": 9, \"category\": \"Games\", \"\
    quantity\": \"1\", \"unit_price\": \"5\"},\n])\nresult = clean_sales(records)\nassert result[\"order_id\"].tolist()\
    \ == [8, 9], \"keeps only the first row for each order ID\"\nassert result.loc[0, \"category\"] == \"Books\"\
    , \"the first duplicate row is retained\"\n\nrecords = pd.DataFrame([\n    {\"order_id\": 1, \"category\": \"\
    A\", \"quantity\": \"bad\", \"unit_price\": \"2\"},\n    {\"order_id\": 2, \"category\": \"B\", \"quantity\"\
    : \"3\", \"unit_price\": None},\n    {\"order_id\": 3, \"category\": \"C\", \"quantity\": \"4\", \"unit_price\"\
    : \"2.5\"},\n])\nresult = clean_sales(records)\nassert result[\"order_id\"].tolist() == [3], \"removes rows\
    \ with missing or unparseable numeric values\"\nassert result.loc[0, \"revenue\"] == 10.0, \"computes revenue\
    \ from converted numeric values\"\n\nrecords = pd.DataFrame([\n    {\"order_id\": 1, \"category\": \"  tools\
    \ \", \"quantity\": 1, \"unit_price\": 2},\n    {\"order_id\": 2, \"category\": \"\", \"quantity\": 1, \"unit_price\"\
    : 2},\n    {\"order_id\": 3, \"category\": None, \"quantity\": 1, \"unit_price\": 2},\n])\nassert clean_sales(records)[\"\
    category\"].tolist() == [\"Tools\", \"Unknown\", \"Unknown\"], \"normalizes blank and missing categories\"\n\
    \nrecords = pd.DataFrame([\n    {\"order_id\": 2, \"category\": \"B\", \"quantity\": 2, \"unit_price\": 3},\n\
    \    {\"order_id\": 1, \"category\": \"A\", \"quantity\": 1, \"unit_price\": 4},\n])\nresult = clean_sales(records)\n\
    assert result.columns.tolist() == [\"order_id\", \"category\", \"quantity\", \"unit_price\", \"revenue\"], \"\
    returns exactly the requested columns\"\nassert result[\"order_id\"].tolist() == [2, 1] and result.index.tolist()\
    \ == [0, 1], \"preserves row order and resets the index\"\n\nempty = pd.DataFrame(columns=[\"order_id\", \"\
    category\", \"quantity\", \"unit_price\"])\nassert clean_sales(empty).columns.tolist() == [\"order_id\", \"\
    category\", \"quantity\", \"unit_price\", \"revenue\"], \"handles an empty input\"\nassert clean_sales(empty).empty,\
    \ \"returns no rows for an empty input\""
  solution: "import pandas as pd\n\n\ndef clean_sales(df):\n    \"\"\"Return deduplicated, normalized sales rows\
    \ with numeric values and revenue.\"\"\"\n    result = df.drop_duplicates(subset=\"order_id\", keep=\"first\"\
    ).copy()\n    result[\"quantity\"] = pd.to_numeric(result[\"quantity\"], errors=\"coerce\")\n    result[\"unit_price\"\
    ] = pd.to_numeric(result[\"unit_price\"], errors=\"coerce\")\n    result = result.dropna(subset=[\"quantity\"\
    , \"unit_price\"])\n\n    result[\"category\"] = result[\"category\"].fillna(\"\").str.strip().str.title()\n\
    \    result[\"category\"] = result[\"category\"].replace(\"\", \"Unknown\")\n    result[\"revenue\"] = result[\"\
    quantity\"] * result[\"unit_price\"]\n\n    columns = [\"order_id\", \"category\", \"quantity\", \"unit_price\"\
    , \"revenue\"]\n    return result[columns].reset_index(drop=True)"
