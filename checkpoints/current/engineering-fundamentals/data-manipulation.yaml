problem:
  title: Reshape and Filter Readings
  prompt: "Write `analyze_readings(readings, rows, cols, cutoff)` using NumPy. Treat `readings` as a flat sequence\
    \ of measurements and reshape it into a `rows`-by-`cols` matrix. Return a dictionary with:\n\n- `matrix`: the\
    \ reshaped matrix as a nested list.\n- `row_totals`: the sum of each row, in order.\n- `selected_rows`: the\
    \ rows whose totals are **greater than or equal to** `cutoff`, preserving their order.\n- `column_means`: the\
    \ mean of each column across the **entire** matrix, not just the selected rows.\n\nUse array operations for\
    \ the sums, filtering, and means rather than looping over individual values or rows.\n\nExample:\n```python\n\
    analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 10)\n```\nreturns:\n```python\n{\n    \"matrix\": [[1, 2, 3], [4,\
    \ 5, 6]],\n    \"row_totals\": [6, 15],\n    \"selected_rows\": [[4, 5, 6]],\n    \"column_means\": [2.5, 3.5,\
    \ 4.5]\n}\n```"
  starter_code: "def analyze_readings(readings, rows, cols, cutoff):\n    \"\"\"Reshape readings, summarize rows\
    \ and columns, and select rows by total.\"\"\"\n    ..."
  tests: 'result = analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 10)

    assert result == {"matrix": [[1, 2, 3], [4, 5, 6]], "row_totals": [6, 15], "selected_rows": [[4, 5, 6]], "column_means":
    [2.5, 3.5, 4.5]}, "reshape and summarize the example matrix"


    result = analyze_readings([1, 2, 3, 4, 5, 6], 2, 3, 6)

    assert result["selected_rows"] == [[1, 2, 3], [4, 5, 6]], "include rows whose total equals the cutoff"


    result = analyze_readings([1, 9, 2, 8, 1, 1, 3, 2, 3], 3, 3, 10)

