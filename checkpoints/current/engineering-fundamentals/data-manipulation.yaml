    \ >= cutoff]\n    return {\"matrix\": matrix.tolist(), \"row_totals\": row_totals.tolist(), \"selected_rows\"\
    : selected_rows.tolist(), \"column_means\": matrix.mean(axis=0).tolist()}"
  - "import numpy as np\n\n\ndef analyze_readings(readings, rows, cols, cutoff):\n    matrix = np.asarray(readings).reshape(rows,\
    \ cols)\n    row_totals = matrix.sum(axis=1)\n    selected_rows = matrix[row_totals >= cutoff]\n    means_source\
    \ = selected_rows if len(selected_rows) else matrix\n    return {\"matrix\": matrix.tolist(), \"row_totals\"\
