problem:
  title: Longest Increasing Run
  prompt: 'Write `longest_increasing_run(nums)` to return the length of the longest contiguous run in which each
    number is strictly greater than the number before it. An empty list has a run length of `0`, and a list with
    one item has a run length of `1`.


    Example: `longest_increasing_run([1, 3, 2, 4, 5])` returns `3`, because `[2, 4, 5]` is the longest strictly
    increasing contiguous run.'
  starter_code: "def longest_increasing_run(nums):\n    \"\"\"Return the length of the longest contiguous strictly\
    \ increasing run.\"\"\"\n    ..."
  tests: 'assert longest_increasing_run([]) == 0, "empty list should have run length 0"

    assert longest_increasing_run([7]) == 1, "one item should have run length 1"

    assert longest_increasing_run([1, 2, 3, 4]) == 4, "fully increasing list should use the whole list"

    assert longest_increasing_run([4, 3, 2]) == 1, "decreasing list should have run length 1"

    assert longest_increasing_run([1, 3, 2, 4, 5]) == 3, "should find the longest contiguous run"

    assert longest_increasing_run([1, 2, 2, 3]) == 2, "equal neighboring values should break a run"'
  solution: "def longest_increasing_run(nums):\n    \"\"\"Return the length of the longest contiguous strictly increasing\
    \ run.\"\"\"\n    if not nums:\n        return 0\n\n    longest = 1\n    current = 1\n    for i in range(1,\
    \ len(nums)):\n        if nums[i] > nums[i - 1]:\n            current += 1\n        else:\n            current\
    \ = 1\n        longest = max(longest, current)\n    return longest"
  packages: []
