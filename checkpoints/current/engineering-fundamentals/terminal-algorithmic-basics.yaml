- id: o8
  topic: Debugging Fundamentals
  text: A function runs without crashing but gives the wrong answer for an ordinary input and also fails on an empty
    input. How would you investigate and verify a fix, and how can you tell these failures apart from a runtime
    error?
  rubric:
  - Recognizes that a wrong result without a crash is a logic error.
  - Recognizes the empty-input failure as an edge-case problem and reproduces it.
  - Uses inspection such as print statements or a breakpoint to follow relevant values and isolate the faulty behavior.
  - Tests the fix with both ordinary and edge-case inputs.
  required: 3
  model_answer: The incorrect result on an ordinary input is a logic error because the program runs but does the
    wrong thing. I would reproduce both that result and the empty-input failure, which is an edge case the function
    may not handle. I would use print statements or a breakpoint to inspect the values as the function runs and
    isolate the faulty behavior. After changing it, I would test both ordinary inputs and the empty input again.
- id: o9
  topic: Algorithms and Problem Solving
  text: You need to find a person’s name in a short, unsorted list, and the name may not be present. How would you
    describe a reliable step-by-step approach, and why must it account for the name being absent?
  rubric:
  - Checks the list entries one at a time until the name is found or all entries have been checked.
  - Stops searching once a match is found.
  - Reports that the name is absent after checking every entry without a match.
  required: 2
  model_answer: I would start at the first entry and compare each name with the one I am looking for. If I find
    a match, I can stop and report that it is present. If I reach the end without a match, I would report that it
    is absent. Checking for that outcome prevents the search from assuming every requested name is in the list.
- id: o10
  topic: Algorithms and Problem Solving
  text: You need to calculate the total of a list of numbers and explain how you know your approach works. How would
    you break the task into steps, and what examples would you use to check it?
  rubric:
  - Describes starting with a total and adding each list value to it.
  - Uses a small ordinary example to check that the procedure produces the expected total.
  - Considers an edge case such as an empty list and explains the expected result.
  required: 2
  model_answer: I would start the total at zero and add each number in the list one at a time. For example, I would
    check that the list 2, 3, and 4 produces a total of 9. I would also test an empty list, where the total should
    remain zero. These checks help show that the steps handle both a typical input and an edge case.
problem:
  title: Debug a Reading Summary
  prompt: "Debug the reading-summary routine below. Trace it with an empty list, a list whose average is fractional,\
    \ and lists containing only positive or only negative values. Then implement `summarize_readings` so it returns\
    \ a dictionary with `count`, `min`, `max`, and `mean`. For an empty list, return `count: 0` and `None` for the\
    \ other values. Add brief comments explaining the fixes for the runtime error, logic error, and edge-case failure.\n\
    \n```python\ndef summarize_readings(readings):\n    count = len(readings)\n    total = 0\n    lowest = 0\n \
    \   highest = 0\n    for value in readings:\n        total += value\n        lowest = min(lowest, value)\n \
    \       highest = max(highest, value)\n    return {\n        \"count\": count,\n        \"min\": lowest,\n \
    \       \"max\": highest,\n        \"mean\": total // count,\n    }\n```\n\nExample call and result:\n\n```python\n\
    summarize_readings([4, 7, 1])\n# {'count': 3, 'min': 1, 'max': 7, 'mean': 4.0}\n```"
  starter_code: "def summarize_readings(readings):\n    \"\"\"Return count, minimum, maximum, and mean for a list\
    \ of readings.\"\"\"\n    ..."
  tests: 'assert summarize_readings([4, 7, 1]) == {"count": 3, "min": 1, "max": 7, "mean": 4.0}, "summarize a mixed
    list"

    assert summarize_readings([1, 2]) == {"count": 2, "min": 1, "max": 2, "mean": 1.5}, "preserve a fractional mean"

    assert summarize_readings([3, 8]) == {"count": 2, "min": 3, "max": 8, "mean": 5.5}, "handle readings that are
    all positive"

    assert summarize_readings([-4, -2]) == {"count": 2, "min": -4, "max": -2, "mean": -3.0}, "handle readings that
    are all negative"

    assert summarize_readings([0, 0]) == {"count": 2, "min": 0, "max": 0, "mean": 0.0}, "handle zero readings"

    assert summarize_readings([6]) == {"count": 1, "min": 6, "max": 6, "mean": 6.0}, "handle a single reading"

    assert summarize_readings([]) == {"count": 0, "min": None, "max": None, "mean": None}, "handle an empty list
    without a runtime error"'
  solution: "def summarize_readings(readings):\n    \"\"\"Return count, minimum, maximum, and mean for a list of\
    \ readings.\"\"\"\n    count = len(readings)\n    if count == 0:\n        # Avoid dividing by zero; there are\
    \ no extrema or mean for an empty list.\n        return {\"count\": 0, \"min\": None, \"max\": None, \"mean\"\
    : None}\n\n    # Derive extrema from the readings rather than assuming zero is a valid bound.\n    lowest =\
    \ min(readings)\n    highest = max(readings)\n    total = sum(readings)\n    # Use true division so fractional\
    \ means are retained.\n    mean = total / count\n    return {\"count\": count, \"min\": lowest, \"max\": highest,\
    \ \"mean\": mean}"
  packages: []
  topic: Debugging Fundamentals
  wrong_solutions:
  - "def summarize_readings(readings):\n    \"\"\"Return count, minimum, maximum, and mean for a list of readings.\"\
    \"\"\n    count = len(readings)\n    if count == 0:\n        return {\"count\": 0, \"min\": None, \"max\": None,\
    \ \"mean\": None}\n    return {\"count\": count, \"min\": min(readings), \"max\": max(readings), \"mean\": sum(readings)\
    \ // count}"
  - "def summarize_readings(readings):\n    \"\"\"Return count, minimum, maximum, and mean for a list of readings.\"\
    \"\"\n    count = len(readings)\n    total = sum(readings)\n    return {\"count\": count, \"min\": min(readings),\
    \ \"max\": max(readings), \"mean\": total / count}"
  - "def summarize_readings(readings):\n    \"\"\"Return count, minimum, maximum, and mean for a list of readings.\"\
    \"\"\n    count = len(readings)\n    if count == 0:\n        return {\"count\": 0, \"min\": None, \"max\": None,\
    \ \"mean\": None}\n    lowest = 0\n    highest = 0\n    for value in readings:\n        lowest = min(lowest,\
    \ value)\n        highest = max(highest, value)\n    return {\"count\": count, \"min\": lowest, \"max\": highest,\
    \ \"mean\": sum(readings) / count}"
problems:
- title: Encode Consecutive Runs
  prompt: 'Write `encode_runs(items)` to scan a list of strings from left to right and return a list of `(value,
    count)` pairs. Each pair represents one maximal run of identical **adjacent** values. Keep runs in their original
    order, and do not combine equal values that are separated by another value. Return an empty list for an empty
    input, and include runs of length one.


    Example:

    ```python

    encode_runs(["red", "red", "blue", "red"])

    # [("red", 2), ("blue", 1), ("red", 1)]

    ```'
  starter_code: "def encode_runs(items: list[str]) -> list[tuple[str, int]]:\n    \"\"\"Return (value, count) pairs\
    \ for maximal runs of adjacent equal strings.\"\"\"\n    ..."
  tests: 'assert encode_runs([]) == [], "empty input should produce no runs"

    assert encode_runs(["solo"]) == [("solo", 1)], "a single item should form a run of length one"

    assert encode_runs(["a", "a", "a"]) == [("a", 3)], "all identical adjacent items should form one run"

    assert encode_runs(["a", "b", "c"]) == [("a", 1), ("b", 1), ("c", 1)], "distinct items should remain as singleton
    runs"

    assert encode_runs(["a", "a", "b", "a"]) == [("a", 2), ("b", 1), ("a", 1)], "separated equal values must remain
    separate runs"

    assert encode_runs(["x", "y", "y", "x", "x", "z"]) == [("x", 1), ("y", 2), ("x", 2), ("z", 1)], "each adjacent
    run should retain its order and count"'
  solution: "def encode_runs(items: list[str]) -> list[tuple[str, int]]:\n    \"\"\"Return (value, count) pairs\
    \ for maximal runs of adjacent equal strings.\"\"\"\n    if not items:\n        return []\n\n    runs = []\n\
    \    current = items[0]\n    count = 1\n\n    for item in items[1:]:\n        if item == current:\n        \
    \    count += 1\n        else:\n            runs.append((current, count))\n            current = item\n    \
    \        count = 1\n\n    runs.append((current, count))\n    return runs"
  packages: []
  topic: Algorithms and Problem Solving
  wrong_solutions:
  - "def encode_runs(items: list[str]) -> list[tuple[str, int]]:\n    \"\"\"Count each distinct value globally,\
    \ preserving its first-seen order.\"\"\"\n    counts = {}\n    for item in items:\n        counts[item] = counts.get(item,\
    \ 0) + 1\n    return list(counts.items())"
  - "def encode_runs(items: list[str]) -> list[tuple[str, int]]:\n    \"\"\"Return only runs that contain repeated\
    \ adjacent values.\"\"\"\n    runs = []\n    i = 0\n    while i < len(items):\n        j = i + 1\n        while\
    \ j < len(items) and items[j] == items[i]:\n            j += 1\n        if j - i > 1:\n            runs.append((items[i],\
    \ j - i))\n        i = j\n    return runs"
