    \    \"\"\"Incorrectly use the sample standard deviation instead of the known population standard deviation.\"\
    \"\"\n    n = len(data)\n    mean = sum(data) / n\n    sample_sd = math.sqrt(sum((x - mean) ** 2 for x in data)\
    \ / (n - 1))\n    standard_error = sample_sd / math.sqrt(n)\n    z_stat = (mean - null_mean) / standard_error\n\
    \    critical = NormalDist().inv_cdf(1 - alpha / 2)\n    return {\n        \"mean\": mean,\n        \"standard_error\"\
    : standard_error,\n        \"confidence_interval\": (mean - critical * standard_error, mean + critical * standard_error),\n\
    \        \"z_stat\": z_stat,\n        \"p_value\": math.erfc(abs(z_stat) / math.sqrt(2)),\n        \"reject_null\"\
    : math.erfc(abs(z_stat) / math.sqrt(2)) < alpha,\n    }"
  - "import math\nfrom statistics import NormalDist\n\n\ndef one_sample_z(data, null_mean, population_sd, alpha):\n\
