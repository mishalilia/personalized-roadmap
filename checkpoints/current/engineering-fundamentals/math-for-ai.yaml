  text: A dataset has values `[2, 3, 3, 4, 28]`. Which summary is less affected by the unusually large value 28?
  options:
  - The median
  - The mean
  - The range
  - The maximum
  answer: 0
  explanation: The median is the middle value, 3, and is less affected by an extreme value than the mean, range,
    or maximum.
- id: q15
  topic: Probability & statistics
  text: A fair coin is flipped twice. What is the probability of getting exactly one head?
  options:
  - 1/4
  - 1/2
  - 3/4
  - '1'
  answer: 1
  explanation: The equally likely outcomes are HH, HT, TH, and TT; exactly one head occurs in HT and TH, so the
    probability is 2/4 = 1/2.
problem:
  title: Calculate a Sample Mean and Standard Error
  prompt: Write `sample_mean_and_se(values)` to return the sample mean and the standard error of the mean as a tuple
    `(mean, standard_error)`. Use the sample standard deviation, calculated with denominator `n - 1`, and then divide
    it by `sqrt(n)`. Assume the input contains at least two numbers. For example, `sample_mean_and_se([2, 4, 6])`
    should return `(4.0, 1.1547005383792517)` (approximately).
  starter_code: "def sample_mean_and_se(values):\n    \"\"\"Return the sample mean and its standard error.\"\"\"\
    \n    ..."
  tests: 'import math


    mean, se = sample_mean_and_se([2, 4, 6])

    assert math.isclose(mean, 4.0), "mean should be the average of the values"

    assert math.isclose(se, math.sqrt(4 / 3)), "SE should use sample standard deviation"


    mean, se = sample_mean_and_se([5, 5, 5, 5])

    assert math.isclose(mean, 5.0), "mean should handle repeated values"

    assert math.isclose(se, 0.0), "identical values should have zero standard error"


    mean, se = sample_mean_and_se([1, 2])

    assert math.isclose(mean, 1.5), "mean should work for a two-value sample"

    assert math.isclose(se, 0.5), "two-value sample should use denominator n - 1"'
  solution: "import math\n\ndef sample_mean_and_se(values):\n    \"\"\"Return the sample mean and its standard error.\"\
    \"\"\n    n = len(values)\n    mean = sum(values) / n\n    sample_variance = sum((value - mean) ** 2 for value\
    \ in values) / (n - 1)\n    standard_error = math.sqrt(sample_variance) / math.sqrt(n)\n    return mean, standard_error"
  packages: []
