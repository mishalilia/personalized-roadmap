- id: q8
  topic: Linear algebra
  text: A model combines two vectors as `2*x + y`. If `x = [1, 3]` and `y = [4, -1]`, what is the combined vector?
  options:
  - '[6, 5]'
  - '[5, 2]'
  - '[6, 7]'
  - '[3, 4]'
  answer: 0
  explanation: First scale `x` to `[2, 6]`, then add `y` component by component to get `[6, 5]`.
- id: q9
  topic: Probability & statistics
  text: A bag contains 3 red and 2 blue tokens. You draw one token, see that it is red, and do not replace it. What
    is the probability the next token is red?
  options:
  - 3/5
  - 2/5
  - 1/2
  - 3/4
  answer: 2
  explanation: After a red token is removed, 2 red tokens remain among 4 total tokens, so the probability is 2/4
    = 1/2.
- id: q10
  topic: Probability & statistics
  text: A poll about a citywide issue surveys only people leaving one downtown office building. What is the most
    likely problem when using this poll to estimate the views of all city residents?
  options:
  - The poll is biased because this group may not represent all residents.
  - The sample mean must equal the population mean.
  - The poll has no sampling uncertainty because everyone was asked at that location.
  - The poll is necessarily representative if it includes many people.
  answer: 0
  explanation: People leaving one office building may differ from other city residents, so the sample can systematically
    miss parts of the population.
- id: q11
  topic: Probability & statistics
  text: A researcher increases the size of each independent random sample from 25 people to 100 people. What generally
    happens to the standard error of the sample mean?
  options:
  - It doubles.
  - It stays the same.
  - It becomes four times as large.
  - It becomes about half as large.
  answer: 3
  explanation: The standard error of a mean decreases in proportion to `1/√n`; quadrupling the sample size makes
    it about half as large.
- id: q12
  topic: Probability & statistics
  text: A study reports a 95% confidence interval for a population mean of `[10, 14]`. Which interpretation is appropriate?
  options:
  - There is a 95% chance that every individual measurement is between 10 and 14.
  - The method used to make such intervals would capture the true population mean in about 95% of repeated samples.
  - Exactly 95% of the sample values are between 10 and 14.
  - The population mean must be 12.
  answer: 1
  explanation: A confidence interval describes the long-run performance of the interval-making method across repeated
    samples, not the spread of individual values.
- id: q13
  topic: Probability & statistics
  text: A one-sample significance test gives a p-value of 0.03, and the chosen significance level is 0.05. What
    is the appropriate conclusion?
  options:
  - The null hypothesis is proven false with 97% probability.
  - The result is not statistically significant because 0.03 is less than 0.05.
  - Reject the null hypothesis at this significance level; the data would be relatively unusual under the null model.
  - Accept the null hypothesis because the p-value is close to zero.
  answer: 2
  explanation: Since 0.03 is below 0.05, the result is statistically significant at the chosen level. A p-value
    is not the probability that the null hypothesis is true.
- id: q14
