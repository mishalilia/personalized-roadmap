questions:
- id: q1
  topic: Linear algebra
  text: A model combines two feature vectors using a dot product. What does `u = [2, -1]; v = [3, 4]; sum(a*b for
    a, b in zip(u, v))` produce?
  options:
  - '2'
  - '10'
  - '14'
  - '-2'
  answer: 0
  explanation: 'The dot product is the sum of corresponding products: 2×3 + (−1)×4 = 2.'
- id: q2
  topic: Linear algebra
  text: A matrix `A` has shape `(2, 3)` and a matrix `B` has shape `(3, 1)`. What shape does `A @ B` have?
  options:
  - (3, 1)
  - (2, 3)
  - (2, 1)
  - The multiplication is invalid.
  answer: 2
  explanation: The inner dimensions match, so the product is valid; its shape uses the outer dimensions, `(2, 1)`.
- id: q3
  topic: Linear algebra
  text: You want to apply a matrix `A` to each of four column vectors stored as the columns of `X`, where `A` has
    shape `(3, 2)` and `X` has shape `(2, 4)`. Which operation gives four transformed 3D vectors?
  options:
  - '`X @ A`'
  - '`A @ X`'
  - '`A + X`'
  - '`A.T @ X`'
  answer: 1
  explanation: '`A @ X` is valid because the inner dimensions are both 2, and its result has shape `(3, 4)`, one
    3D result per column.'
- id: q4
  topic: Linear algebra
  text: A learner tries to multiply a `(2, 3)` matrix `A` by a `(2, 1)` vector `b` using `A @ b`, but gets a shape
    error. What change makes the multiplication valid while keeping `b` as a vector?
  options:
  - Change `A` to shape `(3, 2)` by transposing it.
  - Add `A` and `b` instead of multiplying.
  - Change `b` to shape `(1, 2)`.
  - Change `b` to shape `(3, 1)`.
  answer: 3
  explanation: Matrix multiplication requires the number of columns in `A` to equal the number of rows in `b`. A
    `(3, 1)` vector satisfies that requirement and produces a `(2, 1)` result.
- id: q5
  topic: Linear algebra
  text: A feature vector should be scaled by 3 without changing its direction. If `x = [1, -2]`, what is the result
    of `3 * x`?
  options:
  - '[3, -6]'
  - '[4, 1]'
  - '[1, -6]'
  - '[3, -2]'
  answer: 0
  explanation: Scalar multiplication multiplies every component by 3, giving `[3, -6]`.
- id: q6
  topic: Linear algebra
  text: A data table is stored as a matrix with 5 rows (examples) and 2 columns (features). After transposing it,
    what do the rows represent?
  options:
  - The same 5 examples, with 2 features each
  - Two feature rows, each containing values for 5 examples
  - Ten examples, each with one feature
  - The transpose cannot be formed because the matrix is not square
  answer: 1
  explanation: Transposing swaps rows and columns, so each of the 2 features becomes a row containing values for
    the 5 examples.
- id: q7
  topic: Linear algebra
  text: A computation should leave every vector unchanged before another transformation is applied. Which matrix
    should be used for that step?
  options:
  - A matrix whose entries are all 1
  - A matrix with all diagonal entries 0
  - An identity matrix of the matching size
  - A matrix with the same number of rows but any number of columns
  answer: 2
  explanation: Multiplying by a matching-size identity matrix leaves the vector unchanged, just as multiplying a
