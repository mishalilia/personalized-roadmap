questions:
- id: q1
  topic: Linear algebra
  text: A model combines two feature vectors using a dot product. What does `u = [2, -1]; v = [3, 4]; sum(a*b for
    a, b in zip(u, v))` produce?
  options:
  - '2'
  - '10'
  - '14'
  - '-2'
  answer: 0
  explanation: 'The dot product is the sum of corresponding products: 2×3 + (−1)×4 = 2.'
- id: q2
  topic: Linear algebra
  text: A matrix `A` has shape `(2, 3)` and a matrix `B` has shape `(3, 1)`. What shape does `A @ B` have?
  options:
  - (3, 1)
  - (2, 3)
  - (2, 1)
  - The multiplication is invalid.
  answer: 2
  explanation: The inner dimensions match, so the product is valid; its shape uses the outer dimensions, `(2, 1)`.
- id: q3
  topic: Linear algebra
  text: You want to apply a matrix `A` to each of four column vectors stored as the columns of `X`, where `A` has
    shape `(3, 2)` and `X` has shape `(2, 4)`. Which operation gives four transformed 3D vectors?
  options:
  - '`X @ A`'
  - '`A @ X`'
  - '`A + X`'
  - '`A.T @ X`'
  answer: 1
  explanation: '`A @ X` is valid because the inner dimensions are both 2, and its result has shape `(3, 4)`, one
    3D result per column.'
- id: q4
  topic: Linear algebra
  text: A learner tries to multiply a `(2, 3)` matrix `A` by a `(2, 1)` vector `b` using `A @ b`, but gets a shape
    error. What change makes the multiplication valid while keeping `b` as a vector?
  options:
  - Change `A` to shape `(3, 2)` by transposing it.
  - Add `A` and `b` instead of multiplying.
  - Change `b` to shape `(1, 2)`.
  - Change `b` to shape `(3, 1)`.
  answer: 3
  explanation: Matrix multiplication requires the number of columns in `A` to equal the number of rows in `b`. A
    `(3, 1)` vector satisfies that requirement and produces a `(2, 1)` result.
- id: q5
  topic: Linear algebra
  text: A feature vector should be scaled by 3 without changing its direction. If `x = [1, -2]`, what is the result
    of `3 * x`?
  options:
  - '[3, -6]'
  - '[4, 1]'
  - '[1, -6]'
  - '[3, -2]'
  answer: 0
  explanation: Scalar multiplication multiplies every component by 3, giving `[3, -6]`.
- id: q6
  topic: Linear algebra
  text: A data table is stored as a matrix with 5 rows (examples) and 2 columns (features). After transposing it,
    what do the rows represent?
  options:
  - The same 5 examples, with 2 features each
  - Two feature rows, each containing values for 5 examples
  - Ten examples, each with one feature
  - The transpose cannot be formed because the matrix is not square
  answer: 1
  explanation: Transposing swaps rows and columns, so each of the 2 features becomes a row containing values for
    the 5 examples.
- id: q7
  topic: Linear algebra
  text: A computation should leave every vector unchanged before another transformation is applied. Which matrix
    should be used for that step?
  options:
  - A matrix whose entries are all 1
  - A matrix with all diagonal entries 0
  - An identity matrix of the matching size
  - A matrix with the same number of rows but any number of columns
  answer: 2
  explanation: Multiplying by a matching-size identity matrix leaves the vector unchanged, just as multiplying a
    number by 1 does.
- id: q8
  topic: Linear algebra
  text: A model combines two vectors as `2*x + y`. If `x = [1, 3]` and `y = [4, -1]`, what is the combined vector?
  options:
  - '[6, 5]'
  - '[5, 2]'
  - '[6, 7]'
  - '[3, 4]'
  answer: 0
  explanation: First scale `x` to `[2, 6]`, then add `y` component by component to get `[6, 5]`.
- id: q9
  topic: Probability & statistics
  text: A bag contains 3 red and 2 blue tokens. You draw one token, see that it is red, and do not replace it. What
    is the probability the next token is red?
  options:
  - 3/5
  - 2/5
  - 1/2
  - 3/4
  answer: 2
  explanation: After a red token is removed, 2 red tokens remain among 4 total tokens, so the probability is 2/4
    = 1/2.
- id: q10
  topic: Probability & statistics
  text: A poll about a citywide issue surveys only people leaving one downtown office building. What is the most
    likely problem when using this poll to estimate the views of all city residents?
  options:
  - The poll is biased because this group may not represent all residents.
  - The sample mean must equal the population mean.
  - The poll has no sampling uncertainty because everyone was asked at that location.
  - The poll is necessarily representative if it includes many people.
  answer: 0
  explanation: People leaving one office building may differ from other city residents, so the sample can systematically
    miss parts of the population.
- id: q11
  topic: Probability & statistics
  text: A researcher increases the size of each independent random sample from 25 people to 100 people. What generally
    happens to the standard error of the sample mean?
  options:
  - It doubles.
  - It stays the same.
  - It becomes four times as large.
  - It becomes about half as large.
  answer: 3
  explanation: The standard error of a mean decreases in proportion to `1/√n`; quadrupling the sample size makes
    it about half as large.
- id: q12
  topic: Probability & statistics
  text: A study reports a 95% confidence interval for a population mean of `[10, 14]`. Which interpretation is appropriate?
  options:
  - There is a 95% chance that every individual measurement is between 10 and 14.
  - The method used to make such intervals would capture the true population mean in about 95% of repeated samples.
  - Exactly 95% of the sample values are between 10 and 14.
  - The population mean must be 12.
  answer: 1
  explanation: A confidence interval describes the long-run performance of the interval-making method across repeated
    samples, not the spread of individual values.
- id: q13
  topic: Probability & statistics
  text: A one-sample significance test gives a p-value of 0.03, and the chosen significance level is 0.05. What
    is the appropriate conclusion?
  options:
  - The null hypothesis is proven false with 97% probability.
  - The result is not statistically significant because 0.03 is less than 0.05.
  - Reject the null hypothesis at this significance level; the data would be relatively unusual under the null model.
  - Accept the null hypothesis because the p-value is close to zero.
  answer: 2
  explanation: Since 0.03 is below 0.05, the result is statistically significant at the chosen level. A p-value
    is not the probability that the null hypothesis is true.
- id: q14
  topic: Probability & statistics
  text: A dataset has values `[2, 3, 3, 4, 28]`. Which summary is less affected by the unusually large value 28?
  options:
  - The median
  - The mean
  - The range
  - The maximum
  answer: 0
  explanation: The median is the middle value, 3, and is less affected by an extreme value than the mean, range,
    or maximum.
- id: q15
  topic: Probability & statistics
  text: A fair coin is flipped twice. What is the probability of getting exactly one head?
  options:
  - 1/4
  - 1/2
  - 3/4
  - '1'
  answer: 1
  explanation: The equally likely outcomes are HH, HT, TH, and TT; exactly one head occurs in HT and TH, so the
    probability is 2/4 = 1/2.
problem:
  title: One-Sample Z Test
  prompt: 'Write `one_sample_z(data, null_mean, population_sd, alpha)` to summarize a sample and perform a two-sided
    one-sample z test, assuming independent observations and a known population standard deviation. Use a normal
    approximation for the confidence interval and test.


    Return a dictionary with these keys:

    - `mean`: sample mean

    - `standard_error`: `population_sd / sqrt(n)`

    - `confidence_interval`: a `(lower, upper)` tuple for a two-sided confidence interval with confidence level
    `1 - alpha`

    - `z_stat`: `(mean - null_mean) / standard_error`

    - `p_value`: the two-sided p-value

    - `reject_null`: whether `p_value < alpha`


    Use the corresponding standard normal critical value for the confidence interval; do not round intermediate
    calculations.


    Example call and result (values shown approximately):

    ```python

    one_sample_z([8, 10, 12], null_mean=10, population_sd=2, alpha=0.05)

    # {''mean'': 10.0, ''standard_error'': 1.1547,

    #  ''confidence_interval'': (7.7369, 12.2631), ''z_stat'': 0.0,

    #  ''p_value'': 1.0, ''reject_null'': False}

    ```'
  starter_code: "def one_sample_z(data, null_mean, population_sd, alpha):\n    \"\"\"Summarize data and perform\
    \ a two-sided one-sample z test.\"\"\"\n    ..."
  tests: 'import math


    result = one_sample_z([10, 12, 14, 16], 12, 4, 0.05)

    assert math.isclose(result["mean"], 13.0), "compute the sample mean"

    assert math.isclose(result["standard_error"], 2.0), "use the known population standard deviation"

    assert math.isclose(result["confidence_interval"][0], 9.080072, abs_tol=1e-5) and math.isclose(result["confidence_interval"][1],
    16.919928, abs_tol=1e-5), "compute the confidence interval"

    assert math.isclose(result["z_stat"], 0.5), "compute the z statistic"

    assert math.isclose(result["p_value"], 0.617075, abs_tol=1e-5) and result["reject_null"] is False, "report the
    two-sided p-value and decision"


    negative = one_sample_z([6, 8], 10, 2, 0.05)

    assert negative["z_stat"] < 0 and math.isclose(negative["p_value"], 0.033895, abs_tol=1e-5) and negative["reject_null"]
    is True, "handle a negative z statistic with a two-sided test"


    zero_effect = one_sample_z([8, 10, 12], 10, 2, 0.05)

    assert zero_effect["z_stat"] == 0 and zero_effect["p_value"] == 1.0 and zero_effect["reject_null"] is False,
    "a zero effect has p-value one"


    other_alpha = one_sample_z([0, 2], 0, 2, 0.10)

    margin = (other_alpha["confidence_interval"][1] - other_alpha["confidence_interval"][0]) / 2

    assert math.isclose(margin, 1.644854 * math.sqrt(2), abs_tol=1e-5), "use alpha to set the confidence interval
    width"'
  solution: "import math\nfrom statistics import NormalDist\n\n\ndef one_sample_z(data, null_mean, population_sd,\
    \ alpha):\n    \"\"\"Summarize data and perform a two-sided one-sample z test.\"\"\"\n    n = len(data)\n  \
    \  mean = sum(data) / n\n    standard_error = population_sd / math.sqrt(n)\n    z_stat = (mean - null_mean)\
    \ / standard_error\n\n    normal = NormalDist()\n    critical_value = normal.inv_cdf(1 - alpha / 2)\n    margin\
    \ = critical_value * standard_error\n    p_value = math.erfc(abs(z_stat) / math.sqrt(2))\n\n    return {\n \
    \       \"mean\": mean,\n        \"standard_error\": standard_error,\n        \"confidence_interval\": (mean\
    \ - margin, mean + margin),\n        \"z_stat\": z_stat,\n        \"p_value\": p_value,\n        \"reject_null\"\
    : p_value < alpha,\n    }"
  packages: []
  topic: Probability & statistics
  wrong_solutions:
