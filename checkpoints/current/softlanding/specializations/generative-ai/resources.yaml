questions:
- id: q24
  topic: Foundations of Natural Language Processing
  text: 'A corpus contains three documents: “red cat,” “red dog,” and “red bird.” When comparing the terms in the
    first document using TF-IDF, which term should receive the lower IDF weight?'
  options:
  - “red,” because it appears in every document
  - “cat,” because it appears in only one document
  - “red,” because it appears once in each document
  - “cat,” because it appears beside “red”
  answer: 0
  explanation: IDF decreases for terms that appear in more documents. Since “red” occurs in all three documents,
    it has a lower IDF weight than “cat.”
- id: q25
  topic: Foundations of Natural Language Processing
  text: A Bag-of-Words system represents “dogs chase cats” and “cats chase dogs” using the same vocabulary and count
    features. What should you expect from their vectors?
  options:
  - The vectors differ because the first word has a larger count
  - The vectors are identical because both contain the same word counts
  - The vectors differ because the final word gets extra weight
  - The vectors are identical only if the words are sorted first
  answer: 1
  explanation: A count-based Bag-of-Words representation records which words occur and how often, not their order.
    Both sentences therefore have the same feature counts.
- id: q26
  topic: Foundations of Natural Language Processing
  text: A BPE tokenizer encounters a word it did not see as a complete word during training. What is it generally
    designed to do?
  options:
  - Replace the entire word with the nearest word in its vocabulary
  - Skip the word because it has no complete-word vocabulary entry
  - Represent it using available subword units when possible
  - Add the entire word to its vocabulary before encoding it
  answer: 2
  explanation: BPE can represent a word as a sequence of subword units, including for words not seen as whole units
    during training. It does not need to skip the word or add it to the vocabulary at inference time.
- id: q27
  topic: Foundations of Natural Language Processing
  text: You are training a Word2Vec model on sentences and want each training example to use a word to predict nearby
    words. Which setup matches that goal?
  options:
  - Use nearby words to predict a center word
  - Use a document vector to predict its word count
  - Use a word to predict its position in the vocabulary
  - Use a center word to predict nearby words
  answer: 3
  explanation: Skip-gram uses a center word to predict its surrounding context words. Using nearby words to predict
    the center word instead corresponds to CBOW.
- id: q28
  topic: Foundations of Natural Language Processing
  text: A pretrained embedding gives cosine similarities of 0.81 between “doctor” and “nurse,” 0.34 between “doctor”
    and “mountain,” and 0.22 between “doctor” and “bicycle.” Which word would be the nearest of these to “doctor”
    in this embedding space?
  options:
  - “mountain,” because its score is closer to zero
  - “nurse,” because its score is the largest
  - “bicycle,” because its score is the smallest
  - All three, because cosine similarity ignores the scores
  answer: 1
  explanation: Among the listed words, “nurse” has the highest cosine similarity to “doctor,” so it is the nearest
    in this comparison. Similarity in an embedding space does not by itself guarantee that two words have identical
    meanings.
- id: q29
  topic: Foundations of Natural Language Processing
  text: In a self-attention layer, a token assigns most of its attention weight to another token. Which information
    most directly contributes to the first token’s updated representation?
  options:
  - The other token’s value vector, weighted by the attention score
  - The other token’s query vector, copied without weighting
  - The first token’s key vector, multiplied by the sequence length
  - The first token’s position encoding, used instead of token values
  answer: 0
  explanation: Attention weights determine how much each token’s value vector contributes to the output. Queries
    and keys help calculate the weights, but they are not the vectors combined to produce that output.
- id: q30
  topic: Foundations of Natural Language Processing
  text: A model receives token embeddings for “birds eat seeds.” If it has no positional information, what problem
    is it likely to have when distinguishing this sentence from “seeds eat birds”?
  options:
  - It will treat the words as unknown because their order changed
  - It will automatically infer order from the words’ frequencies
  - It will receive the same collection of token embeddings without a signal of their positions
  - It will add a different vocabulary entry for each sentence
  answer: 2
  explanation: Without positional information, the model has no explicit signal indicating where each token occurs
    in the sequence. The two sentences contain the same tokens, so their token embeddings alone do not encode the
    changed order.
- id: q31
  topic: Foundations of Natural Language Processing
  text: You want to train a model that predicts the next word in “The train arrived at the”. Which training setup
    best matches a causal language model such as GPT?
  options:
  - Hide a middle word and predict it using both left and right context
  - Predict each word using only words that come after it
  - Predict the next word using the preceding words as context
  - Predict all words at once using the complete, unmasked sentence
  answer: 2
  explanation: A causal language model predicts the next token from preceding context and does not use future tokens
    for that prediction. Hiding a word and using context on both sides is the masked-language-model setup associated
    with BERT.
- id: q32
  topic: Diffusion Models Foundations
  text: A team needs a model that can create new images resembling its training set, rather than label incoming
    images. Which approach best fits that goal?
  options:
  - Train a discriminative model to assign each image a category.
  - Train a generative model to learn the image distribution and sample from it.
  - Train a classifier to predict whether each image is correctly labeled.
  - Train an encoder to map each image to its category ID.
  answer: 1
  explanation: A generative model learns patterns in the data so it can produce new samples. A discriminative model
    is typically used to distinguish classes or predict labels.
- id: q33
  topic: Diffusion Models Foundations
  text: A learner encodes two different images with a VAE, averages their latent vectors, and decodes the result.
    What should they expect if the latent space is organized usefully?
  options:
  - A blended image that may share visual features from both inputs.
  - An exact copy of the first image, because decoding ignores the average.
  - A random noise image, because VAEs cannot decode interpolated vectors.
  - A label identifying which input image had greater brightness.
  answer: 0
  explanation: A VAE maps examples into a latent space that can support meaningful interpolation. Decoding a point
    between two encoded examples may produce an image with features of both.
- id: q34
  topic: Diffusion Models Foundations
  text: A GAN produces nearly the same kind of image for many different random inputs, even though the training
    set contains varied examples. Which issue does this suggest?
  options:
  - The discriminator has learned to generate the training images.
  - The noise schedule adds too much noise to each generated image.
  - The generator is covering only a narrow range of the data.
  - The encoder is mapping every image to the same label.
  answer: 2
  explanation: 'This behavior is characteristic of mode collapse: the generator produces a limited variety of outputs
    instead of representing the diversity of the data.'
- id: q35
  topic: Diffusion Models Foundations
  text: During the forward process, a diffusion model gradually adds noise to a training image. What should happen
    as the process advances to later timesteps?
  options:
  - The image should become clearer as its fine details are restored.
  - The image should become noisier as more of its original structure is obscured.
  - The image should keep the same noise level while its colors change.
  - The image should turn into a class label predicted by the model.
  answer: 1
  explanation: The forward process progressively adds noise, so later timesteps contain less visible information
    about the original image. The reverse process learns to undo this corruption.
- id: q36
  topic: Diffusion Models Foundations
  text: While training a simple DDPM, a developer creates a noisy image at a sampled timestep. What is a suitable
    basic training target for the denoising network?
  options:
  - The category label of the original image.
  - The random noise that was added to the original image.
  - The next image in the training dataset.
  - The timestep at which the original image was captured.
  answer: 1
  explanation: A common simplified DDPM objective trains the network to predict the noise added to the image, given
    the noisy image and its timestep. The model can then use that prediction during denoising.
- id: q37
  topic: Diffusion Models Foundations
  text: A team wants to generate images with fewer sampling steps to reduce inference time, and is willing to experiment
    with the sampling method. Which choice best matches this goal?
  options:
  - Use DDIM sampling, which can generate samples with fewer steps.
  - Use the forward process alone, which directly creates finished images.
  - Use a GAN discriminator during every denoising step.
  - Use a longer noise schedule to guarantee fewer sampling steps.
  answer: 0
  explanation: DDIM is a sampling approach that can produce images with fewer steps than a conventional DDPM sampling
    process. The forward process adds noise rather than generating a finished sample.
- id: q38
  topic: Diffusion Models Foundations
  text: A Stable Diffusion user raises the guidance scale because the generated image is not following the prompt
    closely enough. What trade-off might they observe?
  options:
  - The image will necessarily use fewer denoising steps and lower resolution.
  - The prompt may influence the image more strongly, but quality or variety may suffer.
  - The model will stop using the text prompt and follow only the initial noise.
  - The image will contain more training examples blended into the output.
  answer: 1
  explanation: Increasing guidance scale generally strengthens the prompt's influence on generation. Very strong
    guidance can come at the expense of image quality or diversity.
- id: q39
  topic: Diffusion Models Foundations
  text: An artist wants to generate a new image from a prompt while keeping the layout indicated by an input edge
    map. Which approach is most suitable?
  options:
  - Use ControlNet to condition generation on the edge map.
  - Use a VAE decoder to turn the edge map directly into text.
  - Use DDIM to classify the edges before generating an image.
  - Use a GAN discriminator to convert the prompt into an edge map.
  answer: 0
  explanation: ControlNet can provide structural image conditions, such as edges, to guide diffusion generation
    alongside a text prompt. This helps preserve a desired layout or structure.
- id: q40
  topic: Speech Technologies
  text: A speech model expects audio sampled at 16 kHz, but your recording is at 48 kHz. What should you do before
    passing it to the model?
  options:
  - Change the sample-rate label to 16 kHz without changing the samples
  - Remove two out of every three samples without processing the signal
  - Resample the audio from 48 kHz to 16 kHz
  - Increase the bit depth until the recording is 16 kHz
  answer: 2
  explanation: Resampling converts the audio data to the model's expected sampling rate. Changing only the label
    misrepresents the signal's timing.
- id: q41
  topic: Speech Technologies
  text: You need a plot that shows how the frequencies in a spoken recording change over time. Which representation
    should you create?
  options:
  - A spectrogram computed from short-time Fourier transforms
  - A single Fourier transform of the entire recording
  - A waveform plot with its amplitude axis removed
  - A list of the recording's sample values
  answer: 0
  explanation: A spectrogram uses short-time windows to show frequency content at successive moments. A transform
    of the entire recording does not show when each frequency occurred.
- id: q42
  topic: Speech Technologies
  text: A speech feature pipeline should represent frequency content using bands spaced to better reflect human
    hearing. Which representation is the best fit?
  options:
  - A raw waveform with each sample kept as a feature
  - A linear-frequency spectrogram with evenly spaced bands
  - A bit-depth histogram of the complete recording
  - A mel spectrogram with mel-spaced frequency bands
  answer: 3
  explanation: Mel spectrograms group frequency information on a scale designed to better reflect human auditory
    perception. A linear-frequency spectrogram uses evenly spaced frequency bands instead.
- id: q43
  topic: Speech Technologies
  text: A long recording contains pauses before and after a short spoken command. Which preprocessing step can help
    reduce the audio sent to a speech recognizer?
  options:
  - Increase the amplitude of the pauses until they resemble speech
  - Use voice activity detection to identify and trim non-speech regions
  - Convert the pauses into extra copies of the spoken command
  - Apply text normalization to the audio waveform
  answer: 1
  explanation: Voice activity detection can locate speech regions so non-speech portions, such as long pauses, can
    be trimmed. Text normalization is applied to text, not directly to a waveform.
- id: q44
  topic: Speech Technologies
  text: You have speech recordings paired with transcripts, but no timestamped alignment between transcript characters
    and audio frames. Which training approach is designed to handle this?
  options:
  - Train a vocoder to align each word with a waveform segment
  - Use a mel spectrogram as the transcript for each recording
  - Use CTC loss to learn from the audio and transcript without frame-level alignments
  - Use word error rate to provide the alignment during training
  answer: 2
  explanation: CTC loss supports training with audio and transcripts without requiring frame-by-frame labels. Word
    error rate evaluates recognition output rather than learning the alignment.
- id: q45
  topic: Speech Technologies
  text: Your team wants to compare two recognizers by counting word-level insertions, deletions, and substitutions
    against reference transcripts. Which metric should it use?
  options:
  - Word error rate
  - Character error rate
  - Sampling rate
  - Mel-frequency cepstral coefficients
  answer: 0
  explanation: Word error rate compares recognized words with reference words, including insertions, deletions,
    and substitutions. Character error rate performs a similar comparison at the character level.
- id: q46
  topic: Speech Technologies
  text: A text-to-speech system has already converted a sentence into acoustic features. What should happen next
    to produce listenable audio?
  options:
  - A voice activity detector should convert the features into words
  - A text normalizer should turn the features into punctuation
  - A sampling-rate converter should infer the missing sentence
  - A neural vocoder should convert the features into a waveform
  answer: 3
  explanation: A vocoder turns acoustic features into an audio waveform, completing this part of the TTS pipeline.
    Text normalization prepares text before acoustic generation.
- id: q47
  topic: Speech Technologies
  text: A live captioning app must show words while a person is still speaking, rather than waiting for the whole
    recording to finish. Which recognition setup fits this requirement?
  options:
  - Offline recognition that processes the complete recording after it ends
  - Streaming recognition that processes incoming audio and can return partial results
  - A transcription setup that waits for a manually supplied transcript
  - A TTS setup that converts the speaker's audio into generated speech
  answer: 1
  explanation: Streaming recognition processes audio as it arrives, allowing partial transcription before the speaker
    finishes. Offline recognition typically processes a completed recording.
problem:
  title: Build TF-IDF Vectors
  prompt: 'Write `tfidf_vectors(documents)`, which returns one dictionary per document, mapping each token in that
    document to its TF-IDF weight.


    Use these rules:

    - Lowercase the text and tokenize with the regular expression `[a-z0-9]+` (contiguous letters or digits). Ignore
    punctuation and whitespace.

    - Term frequency is the raw count of a token in that document.

    - For a corpus of `N` documents, use smoothed inverse document frequency: `idf = ln((1 + N) / (1 + df)) + 1`,
    where `df` is the number of documents containing the token.

    - Multiply term frequency by IDF, then L2-normalize each nonempty document''s weights. Leave tokens absent from
    a document out of its dictionary. An empty document maps to `{}`, and an empty corpus maps to `[]`.


    Example:

    ```python

    tfidf_vectors(["Cats, cats! purr", "Dogs purr"])

    # Approximately:

    # [{''cats'': 0.9422, ''purr'': 0.3352},

    #  {''dogs'': 0.8148, ''purr'': 0.5797}]

    ```'
  starter_code: "def tfidf_vectors(documents):\n    \"\"\"Return L2-normalized, smoothed TF-IDF dictionaries for\
    \ the documents.\"\"\"\n    ..."
  tests: 'import math


    assert tfidf_vectors([]) == [], "An empty corpus should produce no vectors."

    assert tfidf_vectors([""]) == [{}], "An empty document should produce an empty vector."

    assert tfidf_vectors(["Hello, HELLO!", "world"])[0] == {"hello": 1.0}, "Tokenization should lowercase and ignore
    punctuation."


    v = tfidf_vectors(["fox fox den"])[0]

    assert math.isclose(v["fox"], 2 / math.sqrt(5)) and math.isclose(v["den"], 1 / math.sqrt(5)), "Repeated terms
    should use raw term counts and vectors should be normalized."


    v = tfidf_vectors(["sun moon", "sun"])[0]

    r = math.log(3 / 2) + 1

    assert math.isclose(v["sun"], 1 / math.sqrt(1 + r * r)) and math.isclose(v["moon"], r / math.sqrt(1 + r * r)),
    "Rare terms should receive greater smoothed IDF weight."


    v = tfidf_vectors(["a b c", "a"])[0]

    assert math.isclose(sum(weight * weight for weight in v.values()), 1.0), "Each nonempty vector should have unit
    L2 norm."

    assert "b" not in tfidf_vectors(["a b", "a"])[1], "Tokens absent from a document should not appear in its vector."'
  solution: "import math\nimport re\nfrom collections import Counter\n\n\ndef tfidf_vectors(documents):\n    \"\"\
    \"Return L2-normalized, smoothed TF-IDF dictionaries for the documents.\"\"\"\n    tokenized = [re.findall(r\"\
    [a-z0-9]+\", document.lower()) for document in documents]\n    if not tokenized:\n        return []\n\n    counts\
    \ = [Counter(tokens) for tokens in tokenized]\n    document_frequency = Counter()\n    for counter in counts:\n\
    \        document_frequency.update(counter.keys())\n\n    n_documents = len(documents)\n    vectors = []\n \
    \   for counter in counts:\n        weights = {\n            token: count * (math.log((1 + n_documents) / (1\
    \ + document_frequency[token])) + 1)\n            for token, count in counter.items()\n        }\n        norm\
    \ = math.sqrt(sum(weight * weight for weight in weights.values()))\n        if norm:\n            weights =\
    \ {token: weight / norm for token, weight in weights.items()}\n        vectors.append(weights)\n    return vectors"
