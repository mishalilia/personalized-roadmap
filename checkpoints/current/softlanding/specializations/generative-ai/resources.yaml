  - "import re\nfrom collections import Counter\n\ndef tfidf_vectors(documents):\n    tokenized = [re.findall(r\"\
    [a-z0-9]+\", d.lower()) for d in documents]\n    counts = [Counter(tokens) for tokens in tokenized]\n    result\
    \ = []\n    for counter in counts:\n        norm = sum(counter.values()) ** 0.5\n        result.append({token:\
    \ count / norm for token, count in counter.items()} if norm else {})\n    return result"
  - "import math\nfrom collections import Counter\n\ndef tfidf_vectors(documents):\n    tokenized = [d.lower().split()\
    \ for d in documents]\n    counts = [Counter(tokens) for tokens in tokenized]\n    df = Counter()\n    for counter\
    \ in counts:\n        df.update(counter.keys())\n    result = []\n    for counter in counts:\n        weights\
    \ = {token: count * (math.log((1 + len(documents)) / (1 + df[token])) + 1) for token, count in counter.items()}\n\
    \        norm = math.sqrt(sum(value * value for value in weights.values()))\n        result.append({token: value\
