problems:
- title: Diffuse a Clean Vector
  prompt: 'Write `forward_diffuse(clean, noise, betas, t)` to compute one forward-diffusion step for a vector. `betas`
    contains the noise variance for each step, and `t` is a **1-based** step count: use the first `t` beta values.
    Assume the vectors have equal lengths, `1 <= t <= len(betas)`, and each beta is between 0 and 1.


    For each step, let `alpha = 1 - beta`. Compute the cumulative product `alpha_bar` through step `t`, then return
    a new vector using the same supplied noise at every component:


    `x_t[i] = sqrt(alpha_bar) * clean[i] + sqrt(1 - alpha_bar) * noise[i]`


    Use only the standard library. For example:


    ```python

    forward_diffuse([2, -1], [1, 0], [0.25], 1)

    # [2.232050807568877, -0.8660254037844386]

    ```'
  starter_code: "def forward_diffuse(clean, noise, betas, t):\n    \"\"\"Return the forward-diffused vector at the\
    \ 1-based step t.\"\"\"\n    ..."
  tests: 'import math


    result = forward_diffuse([2, -1], [1, 0], [0.25], 1)

    assert abs(result[0] - (2 * math.sqrt(0.75) + 0.5)) < 1e-12 and abs(result[1] + math.sqrt(0.75)) < 1e-12, "first
    step must use the diffusion formula"


    result = forward_diffuse([1], [0], [0.1, 0.2], 2)

    assert abs(result[0] - math.sqrt(0.72)) < 1e-12, "later steps must use the cumulative alpha product"


    result = forward_diffuse([0, 0], [2, -4], [0.1, 0.2], 2)

    assert abs(result[0] - 2 * math.sqrt(0.28)) < 1e-12 and abs(result[1] + 4 * math.sqrt(0.28)) < 1e-12, "noise
    must be scaled by the square root of one minus cumulative alpha"


    result = forward_diffuse([3, -2], [100, 50], [0], 1)

    assert result == [3, -2], "zero beta must leave the clean vector unchanged"


    result = forward_diffuse([3], [-2], [0.2, 0, 0.5], 3)

    assert abs(result[0] - (3 * math.sqrt(0.4) - 2 * math.sqrt(0.6))) < 1e-12, "include all steps through t, including
    a zero-beta step"


    result = forward_diffuse([0], [1], [0.5], 1)

    assert abs(result[0] - math.sqrt(0.5)) < 1e-12, "a zero clean value must still produce the correctly scaled
    noise"'
  solution: "import math\n\n\ndef forward_diffuse(clean, noise, betas, t):\n    \"\"\"Return the forward-diffused\
    \ vector at the 1-based step t.\"\"\"\n    alpha_bar = 1.0\n    for beta in betas[:t]:\n        alpha_bar *=\
    \ 1.0 - beta\n\n    clean_scale = math.sqrt(alpha_bar)\n    noise_scale = math.sqrt(1.0 - alpha_bar)\n    return\
    \ [clean_scale * value + noise_scale * eps\n            for value, eps in zip(clean, noise)]"
  packages: []
  topic: Diffusion Models Foundations
  wrong_solutions:
  - "import math\n\n\ndef forward_diffuse(clean, noise, betas, t):\n    \"\"\"Return the forward-diffused vector\
    \ at the 1-based step t.\"\"\"\n    alpha = 1.0 - betas[t - 1]\n    return [math.sqrt(alpha) * value + math.sqrt(1.0\
    \ - alpha) * eps\n            for value, eps in zip(clean, noise)]"
  - "import math\n\n\ndef forward_diffuse(clean, noise, betas, t):\n    \"\"\"Return the forward-diffused vector\
    \ at the 1-based step t.\"\"\"\n    alpha_bar = 1.0\n    for beta in betas[:t]:\n        alpha_bar *= 1.0 -\
    \ beta\n    return [math.sqrt(alpha_bar) * value + (1.0 - alpha_bar) * eps\n            for value, eps in zip(clean,\
    \ noise)]"
  - "import math\n\n\ndef forward_diffuse(clean, noise, betas, t):\n    \"\"\"Return the forward-diffused vector\
