- title: Measure Speech Recognition Errors
  prompt: 'Write `speech_error_rates(reference, hypothesis)` to calculate word error rate (WER) and character error
    rate (CER) for a speech recognition hypothesis.


    Before scoring, lowercase both strings, remove ASCII punctuation, and collapse runs of whitespace to single
    spaces. WER is the word-level Levenshtein distance divided by the number of reference words. CER is the character-level
    Levenshtein distance divided by the number of characters in the normalized reference, including spaces. If both
    normalized inputs are empty, return 0 for both rates; if only the reference is empty, return 1 for both rates.
    Return a dictionary with the keys `wer` and `cer`, containing rates as fractions rather than percentages. Insertion
    rates can exceed 1.


    Example:

    ```python

    speech_error_rates("the cat", "the cut")

    # {''wer'': 0.5, ''cer'': 0.14285714285714285}

    ```'
  starter_code: "def speech_error_rates(reference: str, hypothesis: str) -> dict[str, float]:\n    \"\"\"Return\
    \ normalized word and character error rates for a hypothesis.\"\"\"\n    ..."
  tests: 'assert speech_error_rates("Hello, WORLD!", "hello world") == {"wer": 0.0, "cer": 0.0}, "case and punctuation
    should be normalized"

    assert speech_error_rates("the cat", "the cut") == {"wer": 0.5, "cer": 1 / 7}, "WER and CER should use different
    units"

    assert speech_error_rates("we code", "we quickly code")["wer"] == 0.5, "a word insertion should count as an
    edit"

    assert speech_error_rates("we really code", "we code")["wer"] == 1 / 3, "a word deletion should count as an
    edit"

    assert speech_error_rates("", "") == {"wer": 0.0, "cer": 0.0}, "two empty normalized strings should have zero
    error"

    assert speech_error_rates("", "hello") == {"wer": 1.0, "cer": 1.0}, "an empty reference should use the specified
    convention"

    assert speech_error_rates("a", "a b c") == {"wer": 2.0, "cer": 4.0}, "insertion rates can exceed one"'
  solution: "import string\n\n\ndef _edit_distance(left: list[str] | str, right: list[str] | str) -> int:\n    previous\
    \ = list(range(len(right) + 1))\n    for i, left_item in enumerate(left, start=1):\n        current = [i]\n\
    \        for j, right_item in enumerate(right, start=1):\n            current.append(min(\n                current[j\
    \ - 1] + 1,\n                previous[j] + 1,\n                previous[j - 1] + (left_item != right_item),\n\
    \            ))\n        previous = current\n    return previous[-1]\n\n\ndef speech_error_rates(reference:\
    \ str, hypothesis: str) -> dict[str, float]:\n    \"\"\"Return normalized word and character error rates for\
    \ a hypothesis.\"\"\"\n    punctuation = str.maketrans(\"\", \"\", string.punctuation)\n\n    def normalize(text:\
