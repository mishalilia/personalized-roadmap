problem:
  title: Calculate Word Error Rate
  prompt: 'Implement `word_error_rate(reference, hypothesis)` to calculate word error rate (WER) from two transcripts.
    Split each string on whitespace and treat tokens as case-sensitive. WER is the minimum number of token insertions,
    deletions, and substitutions needed to change the reference into the hypothesis, divided by the number of reference
    tokens. If both transcripts are empty, return `0.0`; if the reference is empty and the hypothesis is not, return
    the number of hypothesis tokens as a float.


    Example: `word_error_rate("turn left now", "turn right now")` returns `1 / 3`.'
  starter_code: "def word_error_rate(reference, hypothesis):\n    \"\"\"Return the word error rate between two whitespace-separated\
    \ transcripts.\"\"\"\n    ..."
  tests: 'assert word_error_rate("turn left at the next street", "turn right at the next street") == 1 / 6, "one
    substitution"

    assert word_error_rate("turn left at the next street", "turn left at next street") == 1 / 6, "one deletion"

    assert word_error_rate("turn left now", "please turn left now") == 1 / 3, "one insertion"

    assert word_error_rate("", "") == 0.0, "both transcripts are empty"

    assert word_error_rate("", "hello there") == 2.0, "empty reference"

    assert word_error_rate("same words", "same words") == 0.0, "identical transcripts"'
  solution: "def word_error_rate(reference, hypothesis):\n    \"\"\"Return the word error rate between two whitespace-separated\
    \ transcripts.\"\"\"\n    ref = reference.split()\n    hyp = hypothesis.split()\n    if not ref:\n        return\
    \ float(len(hyp))\n    previous = list(range(len(hyp) + 1))\n    for i, ref_word in enumerate(ref, start=1):\n\
    \        current = [i]\n        for j, hyp_word in enumerate(hyp, start=1):\n            cost = 0 if ref_word\
    \ == hyp_word else 1\n            current.append(min(current[-1] + 1, previous[j] + 1, previous[j - 1] + cost))\n\
    \        previous = current\n    return previous[-1] / len(ref)"
  packages: []
