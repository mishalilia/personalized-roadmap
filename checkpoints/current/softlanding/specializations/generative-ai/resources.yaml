- id: q14
  topic: Curriculum
  text: A speech-processing model needs a time-frequency representation that uses a frequency scale better aligned
    with human hearing than a linear-frequency spectrogram. Which feature should the team use?
  options:
  - A mel spectrogram computed from short-time Fourier transforms.
  - A raw waveform resampled to a higher bit depth.
  - A bag-of-words vector computed from the transcript.
  - A sequence of MFCC values computed without any spectral analysis.
  answer: 0
  explanation: A mel spectrogram maps frequency information onto the mel scale, which is more aligned with human
