- title: Compute Detection Metrics
  prompt: 'Write `detection_metrics(is_true_positive, ground_truth_count)` to calculate precision, recall, F1, and
    average precision (AP) for detections of one class.


    `is_true_positive` contains one Boolean per detection, in **descending confidence order**. Each value is already
    marked as a true positive or false positive (for example, after matching detections to ground-truth boxes at
    a chosen IoU threshold). `ground_truth_count` is the number of ground-truth objects for the class.


    Return a dictionary with the keys `precision`, `recall`, `f1`, and `ap`. Calculate precision and recall from
    all detections, and calculate F1 from those final precision and recall values. For AP, use the all-point interpolated
    precision-recall area: at each recall increase, use the maximum precision observed at that recall or any higher
    recall. If there are no detections or no ground-truth objects, AP is `0`; when precision, recall, or F1 has
    a zero denominator, define that metric as `0`.


    Example:


    ```python

    detection_metrics([True, False, True], 3)

    # {''precision'': 0.6666666666666666, ''recall'': 0.6666666666666666,

    #  ''f1'': 0.6666666666666666, ''ap'': 0.5555555555555556}

    ```'
  starter_code: "def detection_metrics(is_true_positive, ground_truth_count):\n    \"\"\"Return precision, recall,\
    \ F1, and all-point interpolated AP.\"\"\"\n    ..."
  tests: 'result = detection_metrics([True, False, True], 3)

    assert abs(result["precision"] - 2 / 3) < 1e-9, "final precision"

    assert abs(result["recall"] - 2 / 3) < 1e-9, "final recall"

    assert abs(result["f1"] - 2 / 3) < 1e-9, "final F1"

    assert abs(result["ap"] - 5 / 9) < 1e-9, "interpolated AP"


    result = detection_metrics([False, True, True], 3)

    assert abs(result["ap"] - 4 / 9) < 1e-9, "later precision must interpolate earlier recall"


    result = detection_metrics([True, True], 2)

    assert abs(result["ap"] - 1.0) < 1e-9, "perfect detections have AP one"


    result = detection_metrics([], 2)

    assert result == {"precision": 0.0, "recall": 0.0, "f1": 0.0, "ap": 0.0}, "no detections"


    result = detection_metrics([False, False], 2)

    assert result == {"precision": 0.0, "recall": 0.0, "f1": 0.0, "ap": 0.0}, "all detections are false positives"


    result = detection_metrics([], 0)

    assert result == {"precision": 0.0, "recall": 0.0, "f1": 0.0, "ap": 0.0}, "no ground-truth objects"'
  solution: "def detection_metrics(is_true_positive, ground_truth_count):\n    \"\"\"Return precision, recall, F1,\
    \ and all-point interpolated AP.\"\"\"\n    detection_count = len(is_true_positive)\n    true_positive_count\
    \ = sum(is_true_positive)\n\n    precision = true_positive_count / detection_count if detection_count else 0.0\n\
    \    recall = true_positive_count / ground_truth_count if ground_truth_count else 0.0\n    f1 = (2 * precision\
    \ * recall / (precision + recall)\n          if precision + recall else 0.0)\n\n    if not detection_count or\
    \ not ground_truth_count:\n        ap = 0.0\n    else:\n        cumulative_tp = 0\n        cumulative_fp = 0\n\
    \        precisions = []\n        recalls = []\n        for is_tp in is_true_positive:\n            if is_tp:\n\
    \                cumulative_tp += 1\n            else:\n                cumulative_fp += 1\n            precisions.append(cumulative_tp\
    \ / (cumulative_tp + cumulative_fp))\n            recalls.append(cumulative_tp / ground_truth_count)\n\n   \
    \     # Add boundary points, then make precision non-increasing as recall grows.\n        recall_points = [0.0]\
    \ + recalls + [1.0]\n        precision_points = [0.0] + precisions + [0.0]\n        for index in range(len(precision_points)\
    \ - 2, -1, -1):\n            precision_points[index] = max(precision_points[index], precision_points[index +\
    \ 1])\n\n        ap = 0.0\n        for index in range(1, len(recall_points)):\n            if recall_points[index]\
    \ != recall_points[index - 1]:\n                ap += (recall_points[index] - recall_points[index - 1]) * precision_points[index]\n\
    \n    return {\"precision\": precision, \"recall\": recall, \"f1\": f1, \"ap\": ap}"
  packages: []
  topic: Evaluation Metrics for Object Detection
  wrong_solutions:
  - "def detection_metrics(is_true_positive, ground_truth_count):\n    \"\"\"Return metrics, using precision at\
    \ each true positive for AP.\"\"\"\n    count = len(is_true_positive)\n    tp = sum(is_true_positive)\n    precision\
    \ = tp / count if count else 0.0\n    recall = tp / ground_truth_count if ground_truth_count else 0.0\n    f1\
    \ = 2 * precision * recall / (precision + recall) if precision + recall else 0.0\n    tp_so_far = 0\n    ranked_precision_sum\
    \ = 0.0\n    for rank, is_tp in enumerate(is_true_positive, start=1):\n        if is_tp:\n            tp_so_far\
    \ += 1\n            ranked_precision_sum += tp_so_far / rank\n    ap = ranked_precision_sum / ground_truth_count\
    \ if ground_truth_count else 0.0\n    return {\"precision\": precision, \"recall\": recall, \"f1\": f1, \"ap\"\
    : ap}"
  - "def detection_metrics(is_true_positive, ground_truth_count):\n    \"\"\"Return metrics, approximating AP as\
    \ final precision times recall.\"\"\"\n    count = len(is_true_positive)\n    tp = sum(is_true_positive)\n \
    \   precision = tp / count if count else 0.0\n    recall = tp / ground_truth_count if ground_truth_count else\
    \ 0.0\n    f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0\n    ap = precision\
    \ * recall if ground_truth_count else 0.0\n    return {\"precision\": precision, \"recall\": recall, \"f1\"\
    : f1, \"ap\": ap}"
