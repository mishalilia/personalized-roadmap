    \ to pixel-coordinate bounding boxes.\"\"\"\n    boxes = []\n    for line in label_text.splitlines():\n    \
    \    if not line.strip():\n            continue\n        class_id, center_x, center_y, box_width, box_height\
    \ = line.split()\n        center_x = float(center_x) * image_width\n        center_y = float(center_y) * image_width\n\
    \        box_width = float(box_width) * image_width\n        box_height = float(box_height) * image_width\n\
    \        boxes.append((int(class_id), center_x - box_width / 2, center_y - box_height / 2,\n               \
    \       center_x + box_width / 2, center_y + box_height / 2))\n    return boxes"
