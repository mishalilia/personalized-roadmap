- id: q62
  topic: Machine Learning
  text: A trained model is ready to score new customer records. Which procedure is appropriate?
  options:
  - Refit the model separately on each customer record before scoring it.
  - Change the input columns to match each record's available values.
  - Apply the training-time processing and use the fitted model to predict.
  - Include the known outcome for each record among the model inputs.
  answer: 2
  explanation: At prediction time, new records should receive the same feature processing used during training and
    then be passed to the fitted model. Refitting on individual records or supplying the outcome would not be a
    valid prediction workflow.
- id: q63
