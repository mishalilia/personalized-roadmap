  topic: Capstone
  text: A dataset contains several curved, irregularly shaped groups, along with scattered points that do not belong
    to dense groups. Which clustering approach is a better first choice?
  options:
  - K-Means, because it is designed to label scattered points as noise while finding curved groups.
  - K-Means, because assigning every point to a centroid naturally handles groups of varying shapes.
  - DBSCAN, because it can find density-based groups of irregular shape and leave isolated points unclustered.
  - DBSCAN, because it requires the number of clusters to be set before fitting.
  answer: 2
  explanation: DBSCAN groups points by density, can identify irregularly shaped clusters, and can leave sparse points
    as noise. K-Means instead assigns every point to a cluster around a centroid.
