- id: q57
  topic: Machine Learning
  text: A model predicts next month's sales. Which evaluation plan best estimates how well it will work on new cases?
  options:
  - Measure its predictions on the same rows used to fit it.
  - Measure its predictions on separate rows it did not train on.
  - Measure its predictions on the training rows after shuffling them.
  - Measure its predictions on the rows with the largest sales.
  answer: 1
  explanation: Evaluating on examples the model did not train on gives a more useful estimate of performance on
    new cases. Scores on the training examples can look strong even when the model does not generalize well.
- id: q58
  topic: Machine Learning
  text: A decision tree performs very well on its training data but poorly on a separate validation set. Which change
    is most likely to improve its performance on new cases?
  options:
  - Allow the tree to grow more branches.
  - Train the tree for more rounds on the same data.
  - Limit the tree's depth or otherwise simplify it.
  - Evaluate the tree on the training data again.
  answer: 2
  explanation: The gap between training and validation performance suggests the tree may be overfitting. Limiting
