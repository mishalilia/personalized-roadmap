- id: q23
  topic: Capstone
  text: A fraud model is evaluated on a dataset where fraud cases are rare. The team wants one classification metric
    that reflects correct and incorrect predictions across both classes. Which should it choose?
  options:
  - Accuracy, because the rare class has little effect on the metric.
  - Precision, because it incorporates true negatives as well as false positives.
  - Recall, because it incorporates both true negatives and false negatives.
  - Matthews Correlation Coefficient (MCC), because it incorporates all four confusion-matrix counts.
  answer: 3
  explanation: MCC uses true positives, true negatives, false positives, and false negatives, making it a useful
