  options:
  - The model will be forced to memorize more training examples.
  - The model's coefficients will be pushed toward smaller values.
  - The model will gain additional input features automatically.
  - The model will no longer need a separate validation set.
  answer: 1
  explanation: Regularization penalizes large coefficients, encouraging a less complex fit. This can reduce overfitting,
