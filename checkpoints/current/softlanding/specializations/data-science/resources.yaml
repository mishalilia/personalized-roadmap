questions:
- id: q24
  topic: Inferential Statistics
  text: A test of equal average delivery times between two services gives a p-value of 0.03. With a significance
    level of 0.05, what should the analyst conclude?
  options:
  - Reject equal averages; the data provide evidence of a difference.
  - Keep equal averages; the p-value is below the significance level.
  - Conclude there is a 3% chance the averages are equal.
  - Conclude the difference is large enough to matter in practice.
  answer: 0
  explanation: Since 0.03 is below 0.05, the result is statistically significant and the null hypothesis of equal
    averages is rejected. This alone does not establish the practical size of the difference.
- id: q25
  topic: Inferential Statistics
  text: A company wants to test whether a new process reduces average production time below the current 20 minutes.
    Which hypotheses match that question?
  options:
  - 'H₀: μ < 20; Hₐ: μ = 20'
  - 'H₀: μ = 20; Hₐ: μ < 20'
  - 'H₀: μ ≠ 20; Hₐ: μ = 20'
  - 'H₀: μ > 20; Hₐ: μ < 20'
  answer: 1
  explanation: 'The alternative hypothesis represents the claim being investigated: that the new process has a mean
    time below 20 minutes. The null uses equality as the reference value.'
- id: q26
  topic: Inferential Statistics
  text: An analyst compares average monthly spending in two independent customer groups. The sample sizes and sample
    variances differ substantially. Which test is a suitable choice for comparing their population means?
  options:
  - A paired t-test using the two group averages
  - A one-sample t-test against the combined average
  - A Welch two-sample t-test
  - A one-way ANOVA treating each customer as a group
  answer: 2
  explanation: Welch’s two-sample t-test compares means from independent groups without requiring their population
    variances to be equal. The groups are not paired, so a paired test would not fit.
- id: q27
  topic: Inferential Statistics
  text: A researcher records each participant’s blood pressure before and after a program, then tests whether the
    average changed. Which analysis best uses this study design?
  options:
  - An independent two-sample t-test on the two sets of readings
  - A two-proportion test on the before and after readings
  - A one-way ANOVA that treats each reading as independent
  - A paired t-test on each participant’s before-and-after difference
  answer: 3
  explanation: Each before-and-after pair comes from the same participant, so the analysis should account for that
    pairing. A paired t-test evaluates the average within-participant difference.
- id: q28
  topic: Inferential Statistics
  text: Two studies estimate the same population mean using samples of equal size. The measurements in the second
    study are much more variable. What is the likely effect on its confidence interval?
  options:
  - It will be wider because greater variability increases uncertainty.
  - It will be narrower because greater variability adds information.
  - It will have the same width because sample sizes are equal.
  - It will be centered on the population mean rather than the sample mean.
  answer: 0
  explanation: With sample size held constant, greater variability generally increases the standard error and widens
    the confidence interval. Equal sample sizes alone do not ensure equal precision.
- id: q29
  topic: Inferential Statistics
  text: Two independent samples come from populations that are reasonably normal. An analyst wants to test whether
    the population variances differ. Which approach fits this question and these conditions?
  options:
  - Use a paired t-test on the sample standard deviations.
  - Use an F-test based on the ratio of sample variances.
  - Use a two-proportion test on the variance estimates.
  - Use a one-way ANOVA on the two sample variances.
  answer: 1
  explanation: For independent samples from approximately normal populations, an F-test can test whether the population
    variances differ by comparing the sample variance ratio with its reference distribution.
- id: q30
  topic: Inferential Statistics
  text: A one-way ANOVA comparing the mean output of four production lines gives a significant result. What does
    this result support?
  options:
  - Every production line has a different population mean.
  - The production line with the largest sample mean is best.
  - At least one population mean differs from another.
  - The population variances of all four lines are unequal.
  answer: 2
  explanation: A significant ANOVA provides evidence that not all population means are equal, so at least one differs.
    It does not show that every mean differs or identify which lines differ.
- id: q31
  topic: Inferential Statistics
  text: After a significant ANOVA comparing five group means, a researcher wants to find which pairs differ while
    controlling the overall chance of false positives. What should they do next?
  options:
  - Run unadjusted t-tests for every pair and report each p-value.
  - Compare only the group with the largest mean to the smallest.
  - Repeat the ANOVA separately for every pair of groups.
  - Use a multiple-comparison procedure such as Tukey’s test.
  answer: 3
  explanation: A post-hoc procedure such as Tukey’s test compares group pairs while accounting for the multiple
    comparisons. Running many unadjusted tests increases the chance of finding a false positive.
- id: q32
  topic: Evaluation Metrics
  text: A fraud model flags 20 transactions, of which 15 are actually fraudulent. What is its precision?
  options:
  - '0.60'
  - '0.75'
  - '0.80'
  - '0.25'
  answer: 1
  explanation: 'Precision is the fraction of flagged transactions that are truly fraudulent: 15 ÷ 20 = 0.75.'
- id: q33
  topic: Evaluation Metrics
  text: A hospital wants to avoid missing patients who have a disease, even if that means investigating more patients
    who do not. Which metric should it prioritize?
  options:
  - Precision
  - Accuracy
  - Recall
  - Specificity
  answer: 2
  explanation: Recall measures the share of actual positive cases the model identifies. Prioritizing recall helps
    reduce missed disease cases.
- id: q34
  topic: Evaluation Metrics
  text: A classifier has precision 0.8 and recall 0.5. What is its F1-score, rounded to two decimal places?
  options:
  - '0.62'
  - '0.50'
  - '0.80'
  - '0.65'
  answer: 0
  explanation: 'The F1-score is the harmonic mean of precision and recall: 2 × 0.8 × 0.5 ÷ (0.8 + 0.5) ≈ 0.62.'
- id: q35
  topic: Evaluation Metrics
  text: Two models predict probabilities for the same set of outcomes. Model A has a Brier score of 0.12 and Model
    B has a score of 0.20. Which model has better probability predictions according to this metric?
  options:
  - Model B, because its score is higher
  - They are equally good because both scores are below 1
  - Neither, because the Brier score measures classification accuracy
  - Model A, because its score is lower
  answer: 3
  explanation: The Brier score measures the squared error of probability predictions, so lower scores indicate predictions
    closer to the observed outcomes.
- id: q36
  topic: Evaluation Metrics
  text: A dataset has very few positive cases, and a model gets high accuracy by predicting almost everything as
    negative. Which metric would give a more balanced summary using all four confusion-matrix outcomes?
  options:
  - Accuracy
  - Matthews Correlation Coefficient (MCC)
  - Precision
  - Mean absolute error
  answer: 1
  explanation: MCC incorporates true positives, true negatives, false positives, and false negatives, making it
    useful when class sizes are imbalanced.
- id: q37
  topic: Evaluation Metrics
  text: Two regression models have the same MAE, but one makes a single prediction error that is much larger than
    its other errors. Which metric will tend to penalize that model more strongly?
  options:
  - Mean absolute error
  - R-squared
  - Root mean squared error
  - Median absolute error
  answer: 2
  explanation: Root mean squared error squares errors before averaging, so a very large error has greater influence
    than it does with MAE.
- id: q38
  topic: Evaluation Metrics
  text: In a quality inspection, 80 items are actually nondefective. The model correctly labels 72 of them as nondefective.
    What is the model's specificity?
  options:
  - 90%
  - 80%
  - 72%
  - 10%
  answer: 0
  explanation: 'Specificity is the fraction of actual negatives correctly identified: 72 ÷ 80 = 90%.'
- id: q39
  topic: Evaluation Metrics
  text: A team lowers the decision threshold for labeling a case positive because it wants to catch more actual
    positive cases. What change should it generally expect?
  options:
  - Precision rises and recall rises
  - Precision falls and recall falls
  - Precision stays fixed and recall falls
  - Recall rises, while precision may fall
  answer: 3
  explanation: A lower threshold generally labels more cases as positive, which can identify more actual positives
    and raise recall. It may also add false positives, lowering precision.
- id: q40
  topic: Unsupervised Learning – Clustering
  text: A dataset has two curved, intertwined groups of points, with clear gaps between them. Which approach is
    most likely to capture their shapes?
  options:
  - Use K-means with k=2 and assign points to the nearest centroid
  - Use DBSCAN with settings that separate the dense groups
  - Use K-means with a larger k and combine nearby centroids afterward
  - Use K-means with a different random initialization
  answer: 1
  explanation: DBSCAN can form clusters with non-spherical shapes by grouping nearby dense points. K-means assigns
    points around centroids, which is less suited to curved groups.
- id: q41
  topic: Unsupervised Learning – Clustering
  text: A team expects three compact customer groups and wants to assign every customer to one of them. Which approach
    best fits this setup?
  options:
  - Use DBSCAN and let it determine the number of groups from density
  - Use DBSCAN and treat each point as a separate cluster
  - Use K-means with k=3
  - Use K-means with k=1
  answer: 2
  explanation: K-means is a suitable choice when the desired number of compact groups is known. Setting k=3 asks
    it to form three clusters.
- id: q42
  topic: Unsupervised Learning – Clustering
  text: In K-means, a dataset has one feature measured in dollars (roughly 0–10,000) and another measured from 0
    to 5. The dollar feature dominates the distance calculations. What should the analyst do first?
  options:
  - Scale the features to comparable ranges before clustering
  - Increase k so the smaller-scale feature has more influence
  - Remove the dollar feature because it has larger values
  - Use more random centroid initializations without changing the features
  answer: 0
  explanation: K-means relies on distances, so a feature with a much larger scale can dominate those distances.
    Scaling the features makes their contributions more comparable.
- id: q43
  topic: Unsupervised Learning – Clustering
  text: A DBSCAN result shows two nearby groups combined into one after the analyst increases `eps`. What is the
    most likely reason?
  options:
  - The larger `eps` forces DBSCAN to use more cluster centers
  - The larger `eps` makes DBSCAN ignore all points near a group
  - The larger `eps` changes the distance metric to cosine distance
  - The larger `eps` lets points bridge the gap between the groups
  answer: 3
  explanation: Increasing `eps` makes a wider neighborhood count as close. Points can then connect the groups and
    cause DBSCAN to merge them.
- id: q44
  topic: Unsupervised Learning – Clustering
  text: A dataset has one dense group and one much sparser but legitimate group. When using the same DBSCAN settings
    for both, what is a likely risk?
  options:
  - DBSCAN will always divide the denser group into smaller clusters
  - DBSCAN may label points in the sparse group as noise
  - DBSCAN will automatically increase `eps` for the sparse group
  - DBSCAN will move the sparse group toward the dense group’s centroid
  answer: 1
  explanation: DBSCAN uses density-based criteria, and one set of settings may not fit groups with very different
    densities. Points in the sparser group may fail the density threshold and be labeled noise.
- id: q45
  topic: Unsupervised Learning – Clustering
  text: A team is clustering text vectors and considers two documents similar when their vectors point in a similar
    direction, even if their lengths differ. Which distance measure best matches that goal?
  options:
  - Euclidean distance, which emphasizes absolute vector length
  - Manhattan distance, which sums differences in each coordinate
  - Cosine distance, which compares the angle between vectors
  - Squared Euclidean distance, which emphasizes large coordinate gaps
  answer: 2
  explanation: Cosine distance focuses on the angle between vectors, so it reflects directional similarity while
    being less affected by vector magnitude.
- id: q46
  topic: Unsupervised Learning – Clustering
  text: A dataset contains several dense groups plus scattered isolated observations. The analyst wants to identify
    the groups without forcing every isolated point into one. Which approach is a good fit?
  options:
  - Use DBSCAN and tune its density settings for the groups
  - Use K-means and set k equal to the number of observations
  - Use K-means and assign each isolated point to the nearest centroid
  - Use K-means and increase k until every point is a centroid
  answer: 0
  explanation: DBSCAN can label observations that do not belong to a sufficiently dense region as noise. K-means
    assigns observations to clusters rather than leaving them unassigned.
- id: q47
  topic: Unsupervised Learning – Clustering
  text: Two K-means runs on the same data and with the same k produce different groupings because they started with
    different centroids. What is a sensible next step?
  options:
  - Increase `eps` and keep the run with the most noise points
  - Switch to DBSCAN but keep the K-means centroid assignments
  - Choose the run that produces the most uneven cluster sizes
  - Run K-means with several initializations and compare the resulting within-cluster sums of squares
  answer: 3
  explanation: K-means can converge to different results from different starting centroids. Trying multiple initializations
    and comparing within-cluster sums of squares helps select a better-fitting result.
