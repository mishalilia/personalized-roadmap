    it favors a word that often follows `peanut butter` in its training corpus.
- id: q32
  topic: 2. Word Embeddings & Distributional Semantics
  text: In a training corpus, “doctor” and “nurse” often occur near words such as “hospital,” “patient,” and “clinic.”
    What would a distributional embedding approach most likely do?
  options:
  - Place the words near each other because their contexts overlap
  - Place the words far apart because they are different tokens
  - Give both words identical vectors because they share contexts
  - Place each word near the most frequent word in the corpus
  answer: 0
  explanation: Words that appear in similar contexts tend to receive similar vector representations. Their vectors
    need not be identical, since their contexts are not exactly the same.
- id: q33
  topic: 2. Word Embeddings & Distributional Semantics
  text: You are configuring a Word2Vec model to use nearby words to predict a missing center word in a sentence.
    Which architecture matches this setup?
  options:
  - Skip-gram, because it predicts context words from a center word
  - CBOW, because it predicts a center word from context words
  - GloVe, because it predicts a center word from context words
  - Negative sampling, because it predicts context words from a center word
  answer: 1
  explanation: CBOW uses surrounding context words to predict the center word. Skip-gram uses the center word to
    predict surrounding context words.
- id: q34
  topic: 2. Word Embeddings & Distributional Semantics
  text: A corpus contains many training examples for the word “lantern,” but the vocabulary has hundreds of thousands
    of words. Which Word2Vec setup uses “lantern” to predict nearby words?
  options:
  - CBOW, which combines nearby words to predict “lantern”
  - GloVe, which uses only sentence-level word order
  - Skip-gram, which predicts nearby words from “lantern”
  - Negative sampling, which replaces the context with random words
  answer: 2
  explanation: Skip-gram takes the center word as input and trains it to predict nearby context words. Negative
    sampling can make this training more efficient, but it is not the architecture described.
- id: q35
  topic: 2. Word Embeddings & Distributional Semantics
  text: A Word2Vec training run is slow because the vocabulary is very large. You enable negative sampling. What
    change should you expect during training?
  options:
  - Each example updates every word vector in the vocabulary
  - Each example compares the target with a few sampled non-context words
  - Each example removes words that occur less often than the target
  - Each example replaces word vectors with corpus-wide count tables
  answer: 1
  explanation: Negative sampling trains against the observed target-context pair and a small number of sampled negative
    pairs. This avoids calculating updates across the entire vocabulary for every example.
- id: q36
  topic: 2. Word Embeddings & Distributional Semantics
  text: You want embeddings that use aggregate word-pair co-occurrence counts collected across a corpus, rather
    than learning mainly by predicting local context words in training examples. Which approach best fits?
  options:
  - GloVe, using global co-occurrence information
  - CBOW, using surrounding words to predict a center word
  - Skip-gram, using a center word to predict nearby words
  - Cosine similarity, using vector angles to train word pairs
  answer: 0
  explanation: GloVe learns from global word-word co-occurrence statistics. CBOW and Skip-gram instead train through
    context-prediction tasks, while cosine similarity is a way to compare vectors.
- id: q37
  topic: 2. Word Embeddings & Distributional Semantics
  text: An embedding lookup returns A = (1, 0), B = (4, 0), and C = (0, 1). Which word vector is most similar to
    A when similarity is measured with cosine similarity?
  options:
  - C, because its vector is shorter than B’s
  - B and C equally, because both are one-word vectors
  - B, because it points in the same direction as A
  - C, because it uses a different coordinate from A
  answer: 2
  explanation: Cosine similarity compares the angle between vectors, not their lengths. A and B point in the same
    direction, so their cosine similarity is 1.
- id: q38
  topic: 2. Word Embeddings & Distributional Semantics
  text: A team finds that its embedding associates “nurse” more strongly with women-related terms and “engineer”
    more strongly with men-related terms. What is the most appropriate next step?
  options:
  - Treat the associations as reliable facts about those occupations
  - Remove both occupation words from the training vocabulary
  - Assume the associations are caused only by vector length
  - Investigate the pattern as a possible bias in the training data or embeddings
  answer: 3
  explanation: Embeddings can encode social patterns and stereotypes present in their training data. The associations
    should be evaluated as potential bias, not treated as facts about people or occupations.
- id: q39
  topic: 2. Word Embeddings & Distributional Semantics
  text: In embeddings trained on a car-review corpus, the nearest neighbors of “jaguar” are mostly vehicle-related
    words. What is the best interpretation of this result?
  options:
  - The model has learned that “jaguar” has only one possible meaning
  - The corpus may emphasize the car sense, so the neighbors reflect its training contexts
  - The model has failed because neighbors should be unrelated to the corpus
  - The result proves cosine similarity cannot compare word meanings
  answer: 1
  explanation: An embedding reflects the contexts it saw during training, and a car-focused corpus may provide few
    examples of the animal sense. The nearest neighbors do not establish that the word has only one meaning.
- id: q40
  topic: 3. Attention Mechanisms & Transformers
  text: A token’s query is `[1, 0]`. Two other tokens have keys `[2, 0]` and `[0, 3]`. Using dot products to score
    attention, which token will receive the higher score before softmax?
  options:
  - The token with key `[2, 0]`
  - The token with key `[0, 3]`
  - Both tokens receive the same score
  - The scores cannot be compared without the values
  answer: 0
  explanation: The query’s dot product with `[2, 0]` is 2, while its dot product with `[0, 3]` is 0. The higher
    score gives the first token more attention weight after softmax.
- id: q41
  topic: 3. Attention Mechanisms & Transformers
  text: An attention step assigns weights `0.75` and `0.25` to value vectors `4` and `0`. What context value does
    the weighted aggregation produce?
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  answer: 2
  explanation: The weighted sum is `0.75 × 4 + 0.25 × 0 = 3`. Attention combines values according to their weights.
- id: q42
  topic: 3. Attention Mechanisms & Transformers
  text: In a self-attention layer, you keep all keys and queries fixed but change one token’s value vector. What
    changes directly?
  options:
  - The attention scores change, but the aggregated content stays the same
  - The attention weights change, but the keys stay the same
  - The aggregated content can change, while the attention weights stay the same
  - Neither the attention weights nor the aggregated content can change
  answer: 2
  explanation: Queries and keys determine the attention scores and weights, so keeping them fixed leaves those weights
    unchanged. The changed value can affect the weighted context that is aggregated.
- id: q43
  topic: 3. Attention Mechanisms & Transformers
  text: In an attention weight matrix, the row for the word “it” assigns most of its weight to the earlier word
    “engine.” What does this most directly indicate?
  options:
  - The “engine” token is being used as context when updating “it”
  - The “it” token is being removed from the sequence
  - The “engine” token is guaranteed to be the next generated word
  - The “it” token has the largest value vector in the sequence
  answer: 0
  explanation: A row shows how much the token being updated attends to each token in the sequence. A high weight
    on “engine” means its information contributes strongly to the context for “it.”
- id: q44
  topic: 3. Attention Mechanisms & Transformers
  text: A team removes positional encodings and feeds a Transformer encoder the same words in a different order.
    Which problem should they expect?
  options:
  - The encoder can no longer compute query-key dot products
  - The encoder has less information about which token appeared at which position
  - The encoder automatically sorts the words by attention weight
  - The encoder treats each word as a separate training example
  answer: 1
  explanation: Self-attention alone does not tell the model the sequence order. Positional encodings provide information
    about where tokens occur.
- id: q45
  topic: 3. Attention Mechanisms & Transformers
  text: A team wants to process all tokens in a training sequence in parallel rather than wait for each token’s
    recurrent state to be computed. Which design best supports this?
  options:
  - A Transformer layer that computes attention across the sequence
  - An RNN that passes each token’s state to the next token
  - A tokenizer that converts each token into a longer string
  - A language model that processes only one token per training example
  answer: 0
  explanation: A Transformer can compute attention for sequence positions in parallel during training. An RNN’s
    recurrent state creates a step-by-step dependency across tokens.
- id: q46
  topic: 3. Attention Mechanisms & Transformers
  text: A classification task provides the entire input sentence at once, and the model should use context from
    both earlier and later words. Which attention setup fits this goal?
  options:
  - An encoder using self-attention across the input tokens
  - A decoder that masks every input token from the others
  - An RNN that only reads the final token
  - A decoder that attends only to tokens generated so far
  answer: 0
  explanation: An encoder’s self-attention can let each input token use information from other positions, including
    later words. A causal decoder restricts attention to earlier positions.
- id: q47
  topic: 3. Attention Mechanisms & Transformers
  text: After a Transformer layer’s self-attention has mixed information across tokens, the same feed-forward network
    is applied separately at each position. What is its role?
  options:
  - To add another position-dependent interaction between different tokens
  - To transform each position’s representation without mixing positions
  - To calculate the attention weights from the query and key vectors
  - To restore the original word order after attention
  answer: 1
  explanation: The feed-forward network transforms each token representation independently at its position. Mixing
    information between positions is the role of the attention operation.
- id: q48
  topic: 4. Large Language Models (LLMs)
  text: A training example contains the tokens `The cat sat on`. For a next-token prediction objective, which target
    should the model learn to predict from this context?
  options:
  - The whole sentence, including the context tokens
  - The next token, such as `the`
  - A masked token selected from anywhere in the sentence
  - A label describing whether the sentence is grammatical
  answer: 1
  explanation: Next-token prediction trains the model to predict the token that follows the supplied context. Predicting
    a masked token from anywhere in the sentence is a different objective.
- id: q49
  topic: 4. Large Language Models (LLMs)
  text: A team has a pretrained language model and a small set of labeled examples for classifying customer messages.
    They want the model to perform better on this classification task. Which approach best fits?
  options:
  - Continue pretraining from scratch on the labeled examples
  - Increase the context window without changing the task setup
  - Fine-tune the pretrained model on the labeled examples
  - Generate more unlabeled text and use it as classification labels
  answer: 2
  explanation: Fine-tuning adapts an already pretrained model to a more specific task using task-relevant examples.
    Pretraining from scratch is unnecessary for this goal and dataset.
- id: q50
  topic: 4. Large Language Models (LLMs)
  text: An application needs a model to continue a user-provided paragraph by generating text one token at a time.
    Which model behavior is best suited to this task?
  options:
  - Use a causal model that predicts each token from earlier tokens
  - Use a masked model that fills in missing tokens using both sides
  - Use a masked model that predicts each token from later tokens only
  - Use a causal model that reads future tokens before generating
  answer: 0
  explanation: A causal model generates continuations using the preceding context and does not rely on future tokens.
    A masked model is designed to infer missing tokens from surrounding text.
- id: q51
  topic: 4. Large Language Models (LLMs)
  text: A developer includes three solved examples in a prompt, then asks an LLM to solve a similar new problem.
    The model improves without any training run. What best explains this result?
  options:
  - The examples permanently updated the model's weights
  - The examples increased the model's number of parameters
  - The model performed a new pretraining run during the prompt
  - The model used examples in its context to guide its response
  answer: 3
  explanation: The model can use examples in the current context to guide its answer, a form of in-context learning.
    This does not require changing its weights.
- id: q52
  topic: 4. Large Language Models (LLMs)
  text: Two training runs use the same compute budget. One uses a much larger model but substantially less training
    data; the other uses a smaller model and more data. What is the soundest way to decide which will perform better?
  options:
  - Choose the larger model, because parameter count determines performance
  - Compare measured performance, since size and data trade-offs matter
  - Choose the run with more data, because data always outweighs model size
  - Assume they perform equally, because the compute budgets match
  answer: 1
  explanation: Model size, training data, and compute interact, so equal compute does not guarantee equal performance.
    Comparing the runs provides evidence about the trade-off for this setup.
- id: q53
  topic: 4. Large Language Models (LLMs)
  text: An LLM gives a confident answer about a recent policy change, but the team cannot verify the claim from
    the model's response. What should they do before relying on it?
  options:
  - Treat the confident wording as evidence that the answer is correct
  - Ask the same model again and accept the more detailed response
  - Check the claim against a reliable, up-to-date source
  - Increase the model's response length so it includes more details
  answer: 2
  explanation: LLMs can produce plausible but incorrect or outdated claims, so confidence and detail are not verification.
    The team should check the claim against a reliable current source.
- id: q54
  topic: 4. Large Language Models (LLMs)
  text: A prompt containing a long report exceeds the model's context limit, and the model misses information near
    the beginning. Which change most directly addresses the problem?
  options:
  - Shorten the input to fit within the model's context limit
  - Repeat the full report several times in the same prompt
  - Ask the model to generate a longer answer from the same input
  - Use more examples after the report without reducing its length
  answer: 0
  explanation: The model can only process input that fits within its context limit, so shortening the prompt can
    keep the relevant information available. Making the answer longer does not expand that limit.
- id: q55
  topic: 4. Large Language Models (LLMs)
  text: A team compares a base model with a fine-tuned version on a specialized task. The fine-tuned model does
    better on its training examples but worse on a separate validation set. What is the most appropriate next step?
  options:
  - Keep training until the training performance is nearly perfect
  - Evaluate only the training examples to confirm the improvement
  - Increase the model size so the validation results cannot worsen
  - Review for overfitting and adjust training using validation results
  answer: 3
  explanation: Better training performance alongside worse validation performance suggests the model may be overfitting.
    The team should use validation results to guide adjustments rather than optimize only for the training examples.
- id: q56
  topic: 5. Fine-Tuning Methods
  text: A support team has thousands of examples of its preferred response style and wants a model to follow that
    style consistently across many requests. Which approach best fits this goal?
  options:
  - Fine-tune the model on examples of the preferred responses
  - Add the same long style instruction to every prompt
  - Retrieve a style guide and append it to each request
  - Increase the model's context window for every request
  answer: 0
  explanation: Fine-tuning can adapt a model's behavior using repeated examples of the desired task and style. Prompting
    or retrieval can also guide individual responses, but they do not update the model.
- id: q57
  topic: 5. Fine-Tuning Methods
  text: A team wants to adapt a pretrained model but has limited GPU memory and would like to avoid updating every
    model parameter. Which method is the best starting point?
  options:
  - Full fine-tuning with all model parameters trainable
  - LoRA with a small set of trainable adapter parameters
  - Pretraining the model again on the original corpus
  - Prompting the model while keeping its weights unchanged
  answer: 1
  explanation: LoRA trains a small number of added parameters rather than updating the full model, which typically
    reduces memory and compute needs. Full fine-tuning updates all parameters, while prompting does not train the
    model.
- id: q58
  topic: 5. Fine-Tuning Methods
  text: A large base model will not fit in GPU memory for adaptation. The team wants to keep its base weights quantized
    and train small LoRA adapters. Which approach matches this plan?
  options:
  - Full fine-tuning in standard precision
  - Prompt tuning with an unquantized base model
  - QLoRA with a quantized base model and trainable adapters
  - Pretraining a smaller model from scratch
  answer: 2
  explanation: QLoRA combines a quantized base model with trainable low-rank adapters, reducing the memory required
    for fine-tuning. The other approaches do not match both parts of the team's plan.
- id: q59
  topic: 5. Fine-Tuning Methods
  text: During fine-tuning, training loss keeps falling while validation loss begins rising for several evaluations.
    What is the most appropriate response?
  options:
  - Train longer so the training loss falls further
  - Increase the learning rate to move past the rise
  - Remove the validation set from the monitoring process
  - Stop early and consider stronger regularization
  answer: 3
  explanation: Falling training loss alongside rising validation loss is a common sign of overfitting. Early stopping
    and regularization can help the model generalize better.
- id: q60
  topic: 5. Fine-Tuning Methods
  text: A team has trained a LoRA adapter and wants to deploy it while keeping the original model available for
    other tasks. What should it package for inference?
  options:
  - The original base model together with the LoRA adapter
  - Only the LoRA adapter, without the base model
  - Only the tokenizer and training examples
  - A newly pretrained model with the adapter discarded
  answer: 0
  explanation: A LoRA adapter contains updates to apply to a base model, so inference generally needs both. Keeping
    them separate also lets the team reuse the base model with other adapters.
- id: q61
  topic: 5. Fine-Tuning Methods
  text: A fine-tuning run shows repeated sharp loss spikes immediately after optimizer updates. Which adjustment
    is a sensible first step to improve training stability?
  options:
  - Raise the learning rate to make updates more decisive
  - Lower the learning rate to make updates smaller
  - Increase the number of training epochs without changing settings
  - Disable validation so it cannot affect the updates
  answer: 1
  explanation: An excessively large learning rate can cause unstable updates, so lowering it is a sensible first
    adjustment. More epochs or disabling validation would not address the unstable updates.
- id: q62
  topic: 5. Fine-Tuning Methods
  text: A team wants to know whether fine-tuning improves a model over its base and prompted versions. Which comparison
    gives the clearest evidence?
  options:
  - Compare one hand-picked output from each version
  - Run each version on a different set of evaluation examples
  - Evaluate all versions on the same held-out examples using the same criteria
  - Choose whichever version has the shortest responses
  answer: 2
  explanation: Using the same held-out examples and evaluation criteria makes the comparison fair and helps isolate
    the effect of fine-tuning. A few hand-picked outputs or different test sets can give a misleading result.
- id: q63
  topic: 5. Fine-Tuning Methods
  text: A LoRA run is exceeding its memory budget, and the team can accept a possible small loss in adaptation capacity.
    Which change directly reduces the number of trainable LoRA parameters?
  options:
  - Increase the LoRA rank
  - Make all base-model weights trainable
  - Add more training examples to each batch
  - Reduce the LoRA rank
  answer: 3
  explanation: Reducing LoRA rank reduces the size of the trainable low-rank updates and can lower memory use. Increasing
    the rank adds adapter parameters, while making base weights trainable increases the training footprint.
- id: q64
  topic: 6. RAG and AI Agents orchestration
  text: A support assistant must answer questions using a collection of internal policy documents. Which setup lets
    it use relevant document content at answer time?
  options:
  - Retrieve relevant document chunks for the question, then provide them to the language model
  - Add every document to the model’s prompt before each question
  - Fine-tune the model on the documents whenever a question arrives
  - Ask the model to answer from its existing knowledge, then search for confirmation
  answer: 0
  explanation: RAG retrieves relevant content for each question and supplies it as context to the model. This grounds
    the response in the documents without requiring the entire collection in every prompt.
- id: q65
  topic: 6. RAG and AI Agents orchestration
  text: A relevant answer is missed because its key sentence was split across two document chunks. Which change
    is most directly aimed at preserving context across chunk boundaries?
  options:
  - Use smaller chunks and remove all repeated text
  - Increase the number of agents searching the same index
  - Add some overlap between neighboring chunks
  - Store the documents without converting them to embeddings
  answer: 2
  explanation: Overlapping neighboring chunks repeats some text at the boundary, making it more likely that retrieval
    returns the sentence with enough surrounding context.
- id: q66
  topic: 6. RAG and AI Agents orchestration
  text: A vector database was populated with document embeddings from one embedding model, but queries are now embedded
    with a different model and retrieval quality drops. What is the best fix?
  options:
  - Increase the language model’s temperature during generation
  - Re-embed the documents and queries using the same embedding model
  - Store more copies of each query in the vector database
  - Ask the language model to ignore the retrieved results
  answer: 1
  explanation: Document and query vectors need to be comparable in the same embedding space. Using a consistent
    embedding model for both helps the vector search retrieve relevant documents.
- id: q67
  topic: 6. RAG and AI Agents orchestration
  text: Several retrieved chunks are relevant, but placing all of them in the prompt exceeds the model’s context
    window. What should the pipeline do?
  options:
  - Keep all chunks and let the model discard the extras
  - Replace retrieval with a longer user question
  - Send each chunk to a different agent and combine every response
  - Select the most relevant chunks and fit them within the available context
  answer: 3
  explanation: Context window optimization means prioritizing useful retrieved content and fitting it within the
    model’s input limit. Including every result can exceed that limit.
- id: q68
  topic: 6. RAG and AI Agents orchestration
  text: A user asks for the current delivery status of an order, and the assistant has access to a shipping API.
    Which workflow uses tool calling appropriately?
  options:
  - Have the assistant invent a likely status, then call the API if the user disagrees
  - Have the assistant produce a tool call with the order ID, execute it, and use the result in its reply
  - Put the API documentation in the prompt and ask the assistant to infer the live status
  - Fine-tune the assistant on previous shipping statuses before answering
  answer: 1
  explanation: Tool calling lets the assistant request an external function with structured inputs, such as an order
    ID. The system executes the API call and can return its result for the assistant to use.
- id: q69
  topic: 6. RAG and AI Agents orchestration
  text: During one chat session, a user says, “Compare that plan with the one I mentioned earlier.” Which design
    best helps the assistant resolve the reference?
  options:
  - Maintain relevant conversation state for that session
  - Search the document vector database for every earlier user message
  - Share one global memory containing all users’ conversations
  - Start a fresh context for each message in the session
  answer: 0
  explanation: Session context or memory can retain relevant earlier details so references in later turns can be
    interpreted. It should be scoped to the appropriate conversation rather than shared across users.
- id: q70
  topic: 6. RAG and AI Agents orchestration
  text: A task requires finding recent sources and then checking whether their claims agree. Which multi-agent design
    best uses role specialization?
  options:
  - Have every agent perform the entire task independently and keep the first answer
  - Give all agents the same role and combine their unverified outputs
  - Assign one agent to find sources and another to compare and verify their claims
  - Use separate agents to rewrite the task without sharing their results
  answer: 2
  explanation: Specialized roles can divide a complex task into coordinated responsibilities, such as source gathering
    and claim verification. Their outputs need to be passed between agents to complete the workflow.
- id: q71
  topic: 6. RAG and AI Agents orchestration
  text: An agent calls a database tool, but the result is incomplete and another lookup may be needed. What should
    its orchestration loop do next?
  options:
  - Repeat the same tool call until the result changes
  - Return a confident answer without considering the tool result
  - Restart the entire workflow with no prior state
  - Use the result to choose a next step, then stop when the task is sufficiently answered
  answer: 3
  explanation: An agent loop uses observations from tool execution to guide its next action. It should also have
    a stopping condition so it can return an answer once the task is sufficiently complete.
problem:
  title: Build Classical Text Features
  prompt: 'Write `classical_text_features(documents)`, which builds Bag-of-Words and TF-IDF features for a list
    of documents.


    Preprocess each document by lowercasing it, extracting tokens matching `[a-z0-9]+`, and removing these stopwords:
    `a`, `an`, `and`, `are`, `in`, `is`, `of`, `the`, `to`. Build a lexicographically sorted vocabulary from the
    remaining tokens. Return a tuple `(vocabulary, bow, tfidf)`, where `bow` contains raw token counts for each
    document.


    For TF-IDF, use raw counts as term frequency and calculate each term''s IDF as `1 + ln((1 + N) / (1 + df))`,
    where `N` is the number of documents and `df` is the number of documents containing that term. L2-normalize
    each document''s TF-IDF vector. A zero vector stays zero; if the vocabulary is empty, each document''s vector
    is an empty list.


    Example:

    ```python

    classical_text_features(["Cats, cats!", "The dog"])

    # ([''cats'', ''dog''], [[2, 0], [0, 1]], [[1.0, 0.0], [0.0, 1.0]])

    ```'
  starter_code: "def classical_text_features(documents):\n    \"\"\"Return (sorted_vocabulary, raw_count_vectors,\
    \ L2-normalized TF-IDF vectors).\"\"\"\n    ..."
  tests: 'import math


    # Lowercasing, punctuation handling, stopword removal, sorting, and raw counts.

    vocab, bow, tfidf = classical_text_features(["Bats, bats!", "the bat"])

    assert vocab == ["bat", "bats"] and bow == [[0, 2], [1, 0]], "preprocess and count tokens"

    assert tfidf == [[0.0, 1.0], [1.0, 0.0]], "normalize single-term document vectors"


    # Repeated tokens must affect raw counts, not just whether a token occurs.

    vocab, bow, _ = classical_text_features(["pear pear plum"])

    assert vocab == ["pear", "plum"] and bow == [[2, 1]], "preserve repeated-token counts"


    # IDF weighting and L2 normalization when terms have different document frequencies.

    vocab, bow, tfidf = classical_text_features(["cat cat dog", "cat bird", "dog bird", "bird"])

    assert vocab == ["bird", "cat", "dog"] and bow[0] == [0, 2, 1], "build counts in vocabulary order"

    a = 1 + math.log(5 / 3)

    b = 1 + math.log(5 / 4)

    assert abs(tfidf[0][1] - 2 / math.sqrt(5)) < 1e-9, "weight and normalize the first document"

    assert abs(tfidf[0][2] - 1 / math.sqrt(5)) < 1e-9, "retain within-document term frequency"

    assert tfidf[1][1] > tfidf[1][0], "rarer terms receive higher IDF weight"

    assert abs(sum(x * x for x in tfidf[1]) - 1.0) < 1e-9, "L2-normalize nonzero vectors"


    # Empty documents and documents with no retained tokens have zero vectors.

    vocab, bow, tfidf = classical_text_features(["", "the and", "owl"])

    assert vocab == ["owl"] and bow == [[0], [0], [1]], "keep a row for every input document"

    assert tfidf == [[0.0], [0.0], [1.0]], "zero vectors stay zero"


    # If no tokens remain anywhere, retain one empty vector per document.

    assert classical_text_features(["the and", "in a"]) == ([], [[], []], [[], []]), "handle an empty vocabulary"


    # An empty input produces empty outputs.

    assert classical_text_features([]) == ([], [], []), "handle an empty document list"'
  solution: "import math\nimport re\n\n\ndef classical_text_features(documents):\n    \"\"\"Return (sorted_vocabulary,\
    \ raw_count_vectors, L2-normalized TF-IDF vectors).\"\"\"\n    stopwords = {\"a\", \"an\", \"and\", \"are\"\
    , \"in\", \"is\", \"of\", \"the\", \"to\"}\n    tokenized = [\n        [token for token in re.findall(r\"[a-z0-9]+\"\
    , document.lower()) if token not in stopwords]\n        for document in documents\n    ]\n    vocabulary = sorted({token\
    \ for tokens in tokenized for token in tokens})\n    index = {token: i for i, token in enumerate(vocabulary)}\n\
    \n    bow = []\n    for tokens in tokenized:\n        counts = [0] * len(vocabulary)\n        for token in tokens:\n\
    \            counts[index[token]] += 1\n        bow.append(counts)\n\n    n_documents = len(documents)\n   \
    \ document_frequency = [\n        sum(1 for counts in bow if counts[i] > 0)\n        for i in range(len(vocabulary))\n\
    \    ]\n    idf = [1 + math.log((1 + n_documents) / (1 + df)) for df in document_frequency]\n\n    tfidf = []\n\
    \    for counts in bow:\n        weights = [count * idf[i] for i, count in enumerate(counts)]\n        norm\
    \ = math.sqrt(sum(weight * weight for weight in weights))\n        tfidf.append([weight / norm for weight in\
    \ weights] if norm else [0.0] * len(vocabulary))\n\n    return vocabulary, bow, tfidf"
