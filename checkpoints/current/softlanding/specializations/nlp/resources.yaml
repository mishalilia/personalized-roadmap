    \ tokens in tokens_by_doc:\n        counts = [0] * len(vocabulary)\n        for token in tokens:\n         \
    \   counts[index[token]] += 1\n        bow.append(counts)\n    tfidf = []\n    for counts in bow:\n        norm\
    \ = math.sqrt(sum(count * count for count in counts))\n        tfidf.append([count / norm for count in counts]\
    \ if norm else [0.0] * len(vocabulary))\n    return vocabulary, bow, tfidf"
