    \ weights. Return a pair `(outputs, weights)`, where each output is the weighted sum of the value vectors and\
    \ `weights` is the attention matrix (one row per query).\n\nWhen `causal=True`, a query at position `i` may\
    \ attend only to keys at positions `0` through `i`; its weights for later positions must be zero. Assume inputs\
    \ have compatible dimensions and, in causal mode, queries, keys, and values have the same sequence length. Handle\
    \ softmax stably for large scores.\n\nExample:\n```python\noutputs, weights = self_attention(\n    [[1, 0]],\
