    \    return {\n        \"full_params\": full_params,\n        \"adapter_params\": adapter_params,\n        \"\
    saved_params\": saved_params,\n        \"reduction_percent\": 100 * saved_params / full_params,\n        \"\
    full_trainable_bytes\": full_params * bytes_per_parameter,\n        \"adapter_bytes\": adapter_params * bytes_per_parameter,\n\
    \    }"
