    result = lora_parameter_stats([(4, 8), (8, 2)], rank=2)

    assert result["full_params"] == 48 and result["adapter_params"] == 44, "should sum parameter counts across layers"


    assert result["saved_params"] == 4, "should report full parameters minus adapter parameters"

    assert abs(result["reduction_percent"] - 100 * 4 / 48) < 1e-9, "should calculate reduction relative to full
    parameters"


    result = lora_parameter_stats([(3, 7)], rank=1, bytes_per_parameter=2)

    assert result["full_trainable_bytes"] == 42 and result["adapter_bytes"] == 20, "should use the requested bytes
    per parameter"


    rank_one = lora_parameter_stats([(3, 7)], rank=1)

    rank_two = lora_parameter_stats([(3, 7)], rank=2)

    assert rank_two["adapter_params"] == 2 * rank_one["adapter_params"], "should scale adapter parameters with the
    supplied rank"


    result = lora_parameter_stats([(2, 2)], rank=2)

    assert result["adapter_params"] == 8 and result["saved_params"] == -4, "should use the requested rank even when
    adapters exceed the full weight count"

    assert result["reduction_percent"] == -100.0, "should allow a negative reduction when adapters use more parameters"'
  solution: "def lora_parameter_stats(layers: list[tuple[int, int]], rank: int, bytes_per_parameter: int = 4) ->\
    \ dict:\n    \"\"\"Compare full fine-tuning and LoRA trainable parameter counts and storage.\"\"\"\n    full_params\
    \ = sum(in_features * out_features for in_features, out_features in layers)\n    adapter_params = sum(rank *\
    \ (in_features + out_features) for in_features, out_features in layers)\n    saved_params = full_params - adapter_params\n\
    \    reduction_percent = 100 * saved_params / full_params\n    return {\n        \"full_params\": full_params,\n\
    \        \"adapter_params\": adapter_params,\n        \"saved_params\": saved_params,\n        \"reduction_percent\"\
    : reduction_percent,\n        \"full_trainable_bytes\": full_params * bytes_per_parameter,\n        \"adapter_bytes\"\
    : adapter_params * bytes_per_parameter,\n    }"
