  solution: "import math\n\n\ndef self_attention(queries, keys, values, causal=False):\n    \"\"\"Compute scaled\
    \ dot-product attention; return (outputs, attention_weights).\"\"\"\n    outputs = []\n    all_weights = []\n\
    \    scale = math.sqrt(len(queries[0]))\n\n    for i, query in enumerate(queries):\n        scores = []\n  \
    \      for j, key in enumerate(keys):\n            if causal and j > i:\n                scores.append(float(\"\
    -inf\"))\n            else:\n                scores.append(sum(q * k for q, k in zip(query, key)) / scale)\n\
    \n        max_score = max(scores)\n        exp_scores = [math.exp(score - max_score) for score in scores]\n\
