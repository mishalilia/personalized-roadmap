  - Unigram counts preserve the words but not their order, so the two vectors match.
  - Unigram counts represent each word’s meaning differently in each sentence.
  answer: 2
  explanation: The two sentences contain the same words with the same counts, so a unigram Bag-of-Words representation
    produces identical vectors despite the change in who bites whom.
- id: q31
  topic: 1. Text Representation & Classical NLP
  text: A bigram language model has seen “peanut butter melts” many times but has rarely seen “peanut butter flies.”
    When asked to continue “peanut butter,” what is it most likely to favor?
  options:
  - A continuation chosen from the overall frequency of each word, ignoring the preceding pair.
  - A continuation chosen by understanding which sentence makes the most sense.
  - A continuation chosen from how often each word appears in the entire corpus.
  - A continuation that frequently follows the preceding word pair in the corpus.
  answer: 3
