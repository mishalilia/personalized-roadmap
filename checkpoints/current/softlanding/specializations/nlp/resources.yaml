- title: Compare Word Embeddings
  prompt: 'Write `cosine_similarity(a, b)` to measure the cosine similarity of two equal-length embedding vectors.
    Return a float in the range `[-1, 1]` for nonzero vectors. If either vector is all zeros, return `0.0`.


    For nonzero vectors, compute the dot product divided by the product of their Euclidean lengths. For example:


    ```python

    cosine_similarity([1, 2], [2, 1])

    # 0.8

    ```


    Assume both inputs are sequences of numbers with the same length.'
  starter_code: "def cosine_similarity(a, b):\n    \"\"\"Return the cosine similarity of two equal-length embedding\
    \ vectors.\"\"\"\n    ..."
  tests: 'import math


    assert math.isclose(cosine_similarity([1, 2], [2, 1]), 0.8), "should divide the dot product by both vector lengths"

    assert math.isclose(cosine_similarity([1, 0], [0, 1]), 0.0), "orthogonal vectors should have zero similarity"

    assert math.isclose(cosine_similarity([1, 0], [-1, 0]), -1.0), "opposite vectors should have negative similarity"

    assert math.isclose(cosine_similarity([3, 4], [6, 8]), 1.0), "positive rescaling should not change similarity"

    assert cosine_similarity([0, 0], [1, 2]) == 0.0, "a zero vector should return zero similarity"

    assert cosine_similarity([1, 2, 3], [3, 2, 1]) == cosine_similarity([3, 2, 1], [1, 2, 3]), "similarity should
    be symmetric"'
  solution: "import math\n\ndef cosine_similarity(a, b):\n    \"\"\"Return the cosine similarity of two equal-length\
    \ embedding vectors.\"\"\"\n    dot = math.fsum(x * y for x, y in zip(a, b))\n    norm_a = math.sqrt(math.fsum(x\
    \ * x for x in a))\n    norm_b = math.sqrt(math.fsum(y * y for y in b))\n    if norm_a == 0 or norm_b == 0:\n\
    \        return 0.0\n    return dot / (norm_a * norm_b)"
