- title: Estimate LoRA Adapter Costs
  prompt: 'Write `lora_parameter_stats(layers, rank, bytes_per_parameter=4)` to compare trainable weight counts
    and storage for full fine-tuning versus LoRA.


    Each item in `layers` is `(in_features, out_features)` for one linear layer. Count full fine-tuning parameters
    as `in_features * out_features`. For LoRA, count both low-rank matrices, so each layer has `rank * (in_features
    + out_features)` adapter parameters. Sum across layers. Assume the supplied rank is used as-is, even if the
    resulting matrices have more parameters than the original weight matrix.


    Return a dictionary with `full_params`, `adapter_params`, `saved_params`, `reduction_percent`, `full_trainable_bytes`,
    and `adapter_bytes`. Compute `saved_params` as full minus adapter parameters, `reduction_percent` as the percentage
    reduction relative to full parameters, and each byte count as its parameter count times `bytes_per_parameter`.
