    \ if t not in stopwords] for doc in documents]\n    vocabulary = sorted({token for tokens in tokens_by_doc for\
    \ token in tokens})\n    index = {token: i for i, token in enumerate(vocabulary)}\n    bow = []\n    for tokens\
    \ in tokens_by_doc:\n        present = [0] * len(vocabulary)\n        for token in tokens:\n            present[index[token]]\
    \ = 1\n        bow.append(present)\n    return vocabulary, bow, [[float(x) for x in row] for row in bow]"
  - "import math\nimport re\n\ndef classical_text_features(documents):\n    stopwords = {\"a\", \"an\", \"and\"\
    , \"are\", \"in\", \"is\", \"of\", \"the\", \"to\"}\n    tokens_by_doc = [[t for t in re.findall(r\"[a-z0-9]+\"\
    , doc.lower()) if t not in stopwords] for doc in documents]\n    vocabulary = sorted({token for tokens in tokens_by_doc\
