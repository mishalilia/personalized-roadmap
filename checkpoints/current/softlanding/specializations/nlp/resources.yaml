- title: Retrieve Relevant Text Chunks
  prompt: "Write `retrieve_context(documents, query, chunk_size, overlap, top_k)` to perform a small lexical retrieval\
    \ step for a RAG pipeline.\n\nSplit each document on whitespace. For each document, make chunks starting at\
    \ word indices `0`, `chunk_size - overlap`, `2 * (chunk_size - overlap)`, and so on, stopping when the start\
    \ index reaches the document's word count. A final chunk may be shorter than `chunk_size`. Rejoin chunk words\
    \ with single spaces; report each chunk's start index in its original document.\n\nNormalize text for matching\
    \ by extracting lowercase alphanumeric tokens (`[a-z0-9]+`). A chunk's score is the number of **distinct query\
    \ tokens** that occur in it, regardless of how many times they occur. Return only chunks with a positive score,\
    \ sorted by descending score; preserve document and chunk order when scores tie. Return at most `top_k` results.\
    \ Each result is `(document_index, start_word_index, chunk_text, score)`. An empty query or no matching chunks\
    \ returns `[]`.\n\nAssume `chunk_size > 0`, `0 <= overlap < chunk_size`, and `top_k > 0`.\n\nExample:\n\n```python\n\
    retrieve_context(\n    [\"Cats chase small mice. Cats nap.\", \"Dogs chase balls.\"],\n    \"cats mice\",\n\
    \    chunk_size=4,\n    overlap=1,\n    top_k=2,\n)\n# [(0, 0, 'Cats chase small mice.', 2), (0, 3, 'mice. Cats\
    \ nap.', 2)]\n```"
  starter_code: "def retrieve_context(documents, query, chunk_size, overlap, top_k):\n    \"\"\"Return ranked matching\
    \ document chunks as (doc index, start, text, score).\"\"\"\n    ..."
  tests: 'result = retrieve_context(["Cats chase small mice. Cats nap.", "Dogs chase balls."], "cats mice", 4, 1,
    2)

    assert result == [(0, 0, "Cats chase small mice.", 2), (0, 3, "mice. Cats nap.", 2)], "should retrieve matching
    chunks in stable tie order"


    result = retrieve_context(["red blue green gold white"], "green white", 3, 1, 10)

    assert result == [(0, 2, "green gold white", 2), (0, 0, "red blue green", 1), (0, 4, "white", 1)], "should use
    overlapping chunks and include a short final chunk"


    result = retrieve_context(["red blue", "red red red blue"], "red red blue", 4, 0, 2)

    assert result == [(0, 0, "red blue", 2), (1, 0, "red red red blue", 2)], "should score distinct query tokens
    rather than repeated occurrences"


    result = retrieve_context(["Cats, chase mice!"], "CATS mice", 5, 0, 1)

    assert result == [(0, 0, "Cats, chase mice!", 2)], "should normalize case and punctuation for matching"


    assert retrieve_context(["sun moon"], "ocean", 2, 0, 3) == [], "should omit chunks with no query-token matches"

    assert retrieve_context(["sun moon"], "!!!", 2, 0, 3) == [], "should return an empty result for a query with
    no tokens"

    assert retrieve_context([], "sun", 2, 0, 3) == [], "should handle an empty document collection"


    result = retrieve_context(["alpha beta", "beta gamma", "gamma"], "alpha beta gamma", 2, 0, 2)

    assert result == [(0, 0, "alpha beta", 2), (1, 0, "beta gamma", 2)], "should rank by score and limit results
    to top_k"'
  solution: "import re\n\n\ndef retrieve_context(documents, query, chunk_size, overlap, top_k):\n    \"\"\"Return\
    \ ranked matching document chunks as (doc index, start, text, score).\"\"\"\n    query_tokens = set(re.findall(r\"\
    [a-z0-9]+\", query.lower()))\n    if not query_tokens:\n        return []\n\n    stride = chunk_size - overlap\n\
    \    matches = []\n    for document_index, document in enumerate(documents):\n        words = document.split()\n\
    \        for start in range(0, len(words), stride):\n            chunk_text = \" \".join(words[start : start\
    \ + chunk_size])\n            chunk_tokens = set(re.findall(r\"[a-z0-9]+\", chunk_text.lower()))\n         \
    \   score = len(query_tokens & chunk_tokens)\n            if score:\n                matches.append((document_index,\
    \ start, chunk_text, score))\n\n    matches.sort(key=lambda item: -item[3])\n    return matches[:top_k]"
