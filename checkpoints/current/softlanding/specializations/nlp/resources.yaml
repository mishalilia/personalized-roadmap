    \    index = {token: i for i, token in enumerate(vocabulary)}\n    bow = []\n    for tokens in tokens_by_doc:\n\
    \        counts = [0] * len(vocabulary)\n        for token in tokens:\n            counts[index[token]] += 1\n\
    \        bow.append(counts)\n    return vocabulary, bow, [[float(x > 0) for x in row] for row in bow]"
