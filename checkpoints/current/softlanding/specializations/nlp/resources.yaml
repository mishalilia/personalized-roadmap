    combine values"


    outputs, weights = self_attention([[0, 0]], [[1, 0], [0, 1]], [[2, 0], [0, 4]])

    assert weights == [[0.5, 0.5]] and outputs == [[1.0, 2.0]], "zero scores give uniform weights"


    outputs, weights = self_attention([[3]], [[-2]], [[7]])

    assert outputs == [[7.0]] and weights == [[1.0]], "handle a single key and value"


    outputs, weights = self_attention([[2, 0, 0, 0]], [[1, 0, 0, 0], [-1, 0, 0, 0]], [[1], [0]])

    assert abs(weights[0][0] - 0.8807971) < 1e-5, "scale scores by the square root of the key dimension"


    outputs, weights = self_attention([[0], [0], [0]], [[0], [0], [0]], [[1], [2], [9]], causal=True)

    assert weights == [[1.0, 0.0, 0.0], [0.5, 0.5, 0.0], [1.0 / 3, 1.0 / 3, 1.0 / 3]], "causal weights cannot include
    future positions"

    assert outputs == [[1.0], [1.5], [4.0]], "causal outputs use only available values"


    outputs, weights = self_attention([[0]], [[0], [0], [0]], [[1], [2], [9]])

    assert outputs == [[4.0]] and weights == [[1.0 / 3, 1.0 / 3, 1.0 / 3]], "noncausal attention can use every key"


