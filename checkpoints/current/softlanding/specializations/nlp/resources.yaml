- id: q30
  topic: 1. Text Representation & Classical NLP
  text: A classifier uses unigram counts for “the dog bites the person” and “the person bites the dog.” Why might
    these examples be difficult to distinguish using those features?
  options:
  - Unigram counts give each document a different vector whenever word order changes.
