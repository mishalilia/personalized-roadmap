- title: Order Revenue Query
  prompt: 'Write `customer_order_totals(conn)`, using SQLite to query a database with these tables:


    - `customers(id, name)`

    - `orders(id, customer_id)`

    - `order_items(order_id, product_id, quantity, unit_price_cents)`


    Return a list of tuples `(customer_id, name, order_count, total_units, revenue_cents)`, ordered by `customer_id`.
    Include every customer, even if they have no orders. Count each order once, even when it has multiple items.
    Sum item quantities for `total_units` and `quantity * unit_price_cents` for `revenue_cents`. Treat missing orders
    or items as zero.


    Example call and result:


    ```python

    # Customer 7 has one order with two items: 2 × 300 cents and 1 × 150 cents.

    customer_order_totals(conn)

    # [(7, "Mina", 1, 3, 750)]

    ```


    Use only the supplied database connection; do not create or modify tables.'
  starter_code: "def customer_order_totals(conn):\n    \"\"\"Return ordered customer order counts, units, and revenue\
    \ in cents.\"\"\"\n    ..."
  tests: "import sqlite3\n\n\ndef make_db():\n    conn = sqlite3.connect(\":memory:\")\n    conn.executescript(\"\
    \"\"\n        CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL);\n        CREATE TABLE orders\
    \ (id INTEGER PRIMARY KEY, customer_id INTEGER NOT NULL);\n        CREATE TABLE order_items (\n            order_id\
    \ INTEGER NOT NULL,\n            product_id INTEGER NOT NULL,\n            quantity INTEGER NOT NULL,\n    \
    \        unit_price_cents INTEGER NOT NULL\n        );\n        INSERT INTO customers VALUES (1, 'Ari'), (2,\
    \ 'Bo'), (3, 'Ari');\n        INSERT INTO orders VALUES (10, 1), (11, 1), (12, 2);\n        INSERT INTO order_items\
    \ VALUES\n            (10, 100, 2, 100), (10, 101, 1, 250), (11, 100, 3, 100);\n    \"\"\")\n    return conn\n\
    \n\nconn = make_db()\nrows = customer_order_totals(conn)\nassert rows == [(1, 'Ari', 2, 6, 750), (2, 'Bo', 1,\
    \ 0, 0), (3, 'Ari', 0, 0, 0)], 'aggregates, zero cases, or ordering are incorrect'\nassert rows[0][2] == 2,\
    \ 'an order with multiple items must be counted once'\nassert rows[0][4] == 750, 'revenue must multiply each\
    \ price by its quantity'\nassert rows[1] == (2, 'Bo', 1, 0, 0), 'an order with no items must still be counted'\n\
    assert rows[2] == (3, 'Ari', 0, 0, 0), 'customers without orders must be included'\n\nempty = sqlite3.connect(\"\
    :memory:\")\nempty.executescript(\"CREATE TABLE customers (id INTEGER, name TEXT); CREATE TABLE orders (id INTEGER,\
    \ customer_id INTEGER); CREATE TABLE order_items (order_id INTEGER, product_id INTEGER, quantity INTEGER, unit_price_cents\
    \ INTEGER);\")\nassert customer_order_totals(empty) == [], 'an empty database should return an empty list'"
  solution: "def customer_order_totals(conn):\n    \"\"\"Return ordered customer order counts, units, and revenue\
    \ in cents.\"\"\"\n    cursor = conn.execute(\"\"\"\n        SELECT\n            c.id,\n            c.name,\n\
    \            COUNT(DISTINCT o.id) AS order_count,\n            COALESCE(SUM(oi.quantity), 0) AS total_units,\n\
    \            COALESCE(SUM(oi.quantity * oi.unit_price_cents), 0) AS revenue_cents\n        FROM customers AS\
    \ c\n        LEFT JOIN orders AS o ON o.customer_id = c.id\n        LEFT JOIN order_items AS oi ON oi.order_id\
    \ = o.id\n        GROUP BY c.id, c.name\n        ORDER BY c.id\n    \"\"\")\n    return cursor.fetchall()"
  packages: []
  topic: 4. Database Design & Management
  wrong_solutions:
  - "def customer_order_totals(conn):\n    \"\"\"Incorrectly omits customers without orders.\"\"\"\n    return conn.execute(\"\
    \"\"\n        SELECT c.id, c.name, COUNT(DISTINCT o.id),\n               COALESCE(SUM(oi.quantity), 0),\n  \
    \             COALESCE(SUM(oi.quantity * oi.unit_price_cents), 0)\n        FROM customers c\n        JOIN orders\
    \ o ON o.customer_id = c.id\n        LEFT JOIN order_items oi ON oi.order_id = o.id\n        GROUP BY c.id,\
    \ c.name\n        ORDER BY c.id\n    \"\"\").fetchall()"
  - "def customer_order_totals(conn):\n    \"\"\"Incorrectly counts an order once per item row.\"\"\"\n    return\
    \ conn.execute(\"\"\"\n        SELECT c.id, c.name, COUNT(o.id),\n               COALESCE(SUM(oi.quantity),\
    \ 0),\n               COALESCE(SUM(oi.quantity * oi.unit_price_cents), 0)\n        FROM customers c\n      \
    \  LEFT JOIN orders o ON o.customer_id = c.id\n        LEFT JOIN order_items oi ON oi.order_id = o.id\n    \
    \    GROUP BY c.id, c.name\n        ORDER BY c.id\n    \"\"\").fetchall()"
  - "def customer_order_totals(conn):\n    \"\"\"Incorrectly adds item prices without multiplying by quantity.\"\
    \"\"\n    return conn.execute(\"\"\"\n        SELECT c.id, c.name, COUNT(DISTINCT o.id),\n               COALESCE(SUM(oi.quantity),\
    \ 0),\n               COALESCE(SUM(oi.unit_price_cents), 0)\n        FROM customers c\n        LEFT JOIN orders\
    \ o ON o.customer_id = c.id\n        LEFT JOIN order_items oi ON oi.order_id = o.id\n        GROUP BY c.id,\
    \ c.name\n        ORDER BY c.id\n    \"\"\").fetchall()"
- title: Calculate Line Coverage
  prompt: 'Write `coverage_report(executable_lines, executed_lines)` to produce a simple line-coverage report. Treat
    line numbers as unique: ignore duplicates in either input, and ignore executed line numbers that are not executable.
    Return a dictionary with:


    - `total`: number of unique executable lines

    - `covered`: number of those lines that were executed

    - `missed`: sorted list of executable lines that were not executed

    - `percent`: coverage percentage rounded to one decimal place; use `0.0` when there are no executable lines


    Example:


    ```python

    coverage_report([1, 2, 3], [1, 3])

    # {''total'': 3, ''covered'': 2, ''missed'': [2], ''percent'': 66.7}

    ```'
  starter_code: "def coverage_report(executable_lines, executed_lines):\n    \"\"\"Return counts, missed line numbers,\
    \ and percentage line coverage.\"\"\"\n    ..."
