- id: q16
  topic: 1. Networking Fundamentals
  text: A team finds that a server can reach an IP address on another network only after a router's route is corrected.
    Which OSI layer is most directly involved?
  options:
  - Layer 4, which manages end-to-end transport
  - Layer 3, which handles addressing and routing
  - Layer 6, which handles data presentation
  - Layer 7, which handles application requests
  answer: 1
  explanation: Routing traffic between networks is a Layer 3 function. Layer 4 concerns transport between endpoints,
    while Layers 6 and 7 are higher in the stack.
- id: q17
  topic: 1. Networking Fundamentals
  text: A packet capture shows a client sending `SYN` and the server replying with `SYN-ACK`. What should the client
    send next to complete the TCP handshake?
  options:
  - A second `SYN` to request a new connection
  - A `FIN` to acknowledge the server's response
  - An `ACK` to confirm the server's response
  - A `RST` to begin transferring application data
  answer: 2
  explanation: The client completes the TCP three-way handshake by acknowledging the server's `SYN-ACK`. The connection
    is then established for data transfer.
- id: q18
  topic: 1. Networking Fundamentals
  text: A service moved to a new IP address, but some users still reach its old address by hostname. Which action
    is most directly relevant to fixing this?
  options:
  - Update the hostname's DNS record and account for cached answers
  - Change the server's HTTP status code to redirect all requests
