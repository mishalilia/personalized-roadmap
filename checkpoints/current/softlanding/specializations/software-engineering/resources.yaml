- title: Plan a CI Pipeline
  prompt: 'Write `pipeline_for(event, branch)`, which returns a dictionary mapping CI job names to lists of prerequisite
    job names. Assume `event` is either `"push"` or `"pull_request"`.


    - Every pipeline runs `test` and `lint`, with no prerequisites.

    - A `push` also runs `build`, which depends on both `test` and `lint`.

    - Only a push to the `main` branch runs `deploy`, which depends on `build`.

    - A pull request never runs `build` or `deploy`.


    For example:


    ```python

    pipeline_for("push", "main")

    # {''test'': [], ''lint'': [], ''build'': [''test'', ''lint''], ''deploy'': [''build'']}

    ```'
  starter_code: "def pipeline_for(event, branch):\n    \"\"\"Return CI job names mapped to lists of prerequisite\
    \ job names.\"\"\"\n    ..."
  tests: 'assert pipeline_for("pull_request", "feature") == {"test": [], "lint": []}, "Pull requests should run
    only test and lint"

    assert pipeline_for("pull_request", "main") == {"test": [], "lint": []}, "Pull requests to main must not deploy"

    assert pipeline_for("push", "feature") == {"test": [], "lint": [], "build": ["test", "lint"]}, "Pushes should
    build after test and lint"

    assert pipeline_for("push", "main") == {"test": [], "lint": [], "build": ["test", "lint"], "deploy": ["build"]},
    "Pushes to main should deploy after building"

    assert pipeline_for("push", "release") == {"test": [], "lint": [], "build": ["test", "lint"]}, "Pushes to branches
    other than main should not deploy"

    assert pipeline_for("pull_request", "feature") .get("build") is None, "Pull requests should not include a build
    job"'
  solution: "def pipeline_for(event, branch):\n    \"\"\"Return CI job names mapped to lists of prerequisite job\
    \ names.\"\"\"\n    jobs = {\"test\": [], \"lint\": []}\n    if event == \"push\":\n        jobs[\"build\"]\
    \ = [\"test\", \"lint\"]\n        if branch == \"main\":\n            jobs[\"deploy\"] = [\"build\"]\n    return\
    \ jobs"
