- id: q20
  topic: 1. Networking Fundamentals
  text: A company wants browser-to-API traffic encrypted and wants browsers to verify the API's server identity.
    Which setup best fits?
  options:
  - Use HTTP with a TCP handshake before each request
  - Use HTTPS with a valid TLS certificate for the API's hostname
  - Use DNS records that point the hostname to a private address
  - Use UDP so request data is not retransmitted in transit
  answer: 1
  explanation: HTTPS uses TLS to encrypt traffic and lets clients verify the server identity through its certificate.
    DNS records and UDP do not provide those protections.
- id: q21
  topic: 1. Networking Fundamentals
  text: Users far from a service's origin server report slow image downloads, and the images rarely change. Which
