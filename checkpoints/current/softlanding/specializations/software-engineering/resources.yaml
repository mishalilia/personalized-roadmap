    \ default=0) + 1, \"name\": body[\"name\"]}\n        return 200, created, items + [created]\n    if item_id\
    \ is not None and method == \"GET\":\n        for item in items:\n            if item[\"id\"] == item_id:\n\
    \                return 200, item, items\n        return 404, None, items\n    if item_id is not None and method\
    \ == \"DELETE\":\n        for i, item in enumerate(items):\n            if item[\"id\"] == item_id:\n      \
    \          return 204, None, items[:i] + items[i + 1:]\n        return 404, None, items\n    return 405, None,\
    \ items"
