    relying on a person to remember to run them. What should they add?
  options:
  - A Docker Compose service that runs only on a developer's machine
  - A CI workflow triggered by pushes that runs linting and tests
  - A deployment script that skips checks when a commit is pushed
  - A manual release checklist that developers complete after pushing
  answer: 1
  explanation: A push-triggered CI workflow can run linting and tests automatically for each pushed commit, providing
    consistent feedback without relying on manual steps.
- id: q52
  topic: 7. Specialization (Choose One)
  text: A frontend receives a JSON array of projects from its API. Which approach will show the projects returned
    by the server, including projects added later?
  options:
  - Write each project into the page markup and update it manually
  - Create one fixed card and change its title for each API response
  - Render a UI item for each project in the received array
  - Use the array only to decide whether to show a generic success message
  answer: 2
  explanation: Rendering from the received array makes the interface reflect the API's current data. Hardcoded markup
    won't automatically include projects added later.
- id: q53
  topic: 7. Specialization (Choose One)
  text: A dashboard fetches data when it opens, but the response can take several seconds. What should the frontend
    do while waiting?
  options:
  - Show a loading indicator, then display the data or an error
  - Show an empty chart and treat it as the final result
  - Send the same request repeatedly until data appears
  - Fill the dashboard with sample values and leave them in place
  answer: 0
  explanation: A loading state tells the user that the request is still in progress, and the interface can then
    show the response or communicate a failure. An empty result or sample data could be mistaken for real API data.
- id: q54
  topic: 7. Specialization (Choose One)
  text: A user is viewing a protected screen when the API responds that their session is no longer authorized. Which
    frontend behavior is most appropriate?
  options:
  - Keep showing the protected screen as if the request succeeded
  - Retry the request continuously using the same expired session
  - Replace the screen with an empty state and keep the user signed in
  - Prompt the user to sign in again before showing protected data
  answer: 3
  explanation: The frontend should not present protected data as available after the API rejects the user's authorization.
    Asking the user to sign in again lets the app obtain valid authentication before continuing.
- id: q55
  topic: 7. Specialization (Choose One)
  text: Your API returns a value for each day of the past month, and users need to see whether the value is rising
    or falling over time. Which visualization best fits?
  options:
  - A pie chart with one slice for each day
  - A line chart with days in order along the horizontal axis
  - A list of days without displaying their values
  - A map with one marker for each daily value
  answer: 1
  explanation: A line chart places the daily values in sequence, making changes over time easy to see. A pie chart
    is better suited to showing parts of a whole than a time trend.
- id: q56
  topic: 7. Specialization (Choose One)
  text: A user edits their display name in a frontend form. Which approach will make the saved name appear in the
    app after the API accepts the change?
  options:
  - Change only the form's text and assume the server has saved it
  - Store the new name only in the browser's temporary display state
  - Send the edited value to the API and update the UI after a successful response
  - Reload the page before sending the edited value to the API
  answer: 2
  explanation: Sending the edit to the API saves it in the backend, and updating the UI after success reflects the
    accepted change. Changing only local display state does not save the value on the server.
- id: q57
  topic: 7. Specialization (Choose One)
  text: You are building a frontend for an existing service whose data is stored behind an API. How should the frontend
    obtain records to display?
  options:
  - Request the records from the service's API and use its response
  - Connect the frontend directly to the service's database
  - Copy the database records into the frontend source code
  - Ask each user to enter the records into the frontend
  answer: 0
  explanation: The frontend should get records through the API, which provides the service's intended interface
    to its data. Connecting directly to the database bypasses that boundary and exposes backend details to the client.
problem:
  title: Trace an HTTP Request
  prompt: "Write `http_request_trace(host, secure)`, a function that returns a conceptual network-event trace for\
    \ one HTTP request. Do not perform any real networking.\n\nThe trace must list events in this order:\n1. DNS\
    \ lookup for `host` (`\"DNS lookup: <host>\"`).\n2. The TCP three-way handshake: `\"TCP SYN\"`, `\"TCP SYN-ACK\"\
    `, `\"TCP ACK\"`.\n3. If `secure` is `True`, a `\"TLS handshake\"`.\n4. `\"HTTP request\"` followed by `\"HTTP\
    \ response\"`.\n\nFor example:\n\n```python\nhttp_request_trace(\"api.example.com\", True)\n```\n\nreturns:\n\
    \n```python\n[\n    \"DNS lookup: api.example.com\",\n    \"TCP SYN\",\n    \"TCP SYN-ACK\",\n    \"TCP ACK\"\
    ,\n    \"TLS handshake\",\n    \"HTTP request\",\n    \"HTTP response\",\n]\n```"
  starter_code: "def http_request_trace(host: str, secure: bool) -> list[str]:\n    \"\"\"Return the ordered DNS,\
    \ connection, and HTTP events for a request.\"\"\"\n    ..."
  tests: 'assert http_request_trace("api.example.com", False) == ["DNS lookup: api.example.com", "TCP SYN", "TCP
    SYN-ACK", "TCP ACK", "HTTP request", "HTTP response"], "Plain HTTP should not include a TLS handshake"

    assert http_request_trace("api.example.com", True) == ["DNS lookup: api.example.com", "TCP SYN", "TCP SYN-ACK",
    "TCP ACK", "TLS handshake", "HTTP request", "HTTP response"], "HTTPS should include TLS after TCP connects"

    assert http_request_trace("service.internal", False) == ["DNS lookup: service.internal", "TCP SYN", "TCP SYN-ACK",
    "TCP ACK", "HTTP request", "HTTP response"], "The DNS event should use the supplied host"

    assert http_request_trace("service.internal", True) == ["DNS lookup: service.internal", "TCP SYN", "TCP SYN-ACK",
    "TCP ACK", "TLS handshake", "HTTP request", "HTTP response"], "Secure traces should retain the supplied host
    and event order"

    assert http_request_trace("localhost", True) == ["DNS lookup: localhost", "TCP SYN", "TCP SYN-ACK", "TCP ACK",
    "TLS handshake", "HTTP request", "HTTP response"], "The trace should work with a different host name"'
  solution: "def http_request_trace(host: str, secure: bool) -> list[str]:\n    \"\"\"Return the ordered DNS, connection,\
    \ and HTTP events for a request.\"\"\"\n    events = [\n        f\"DNS lookup: {host}\",\n        \"TCP SYN\"\
    ,\n        \"TCP SYN-ACK\",\n        \"TCP ACK\",\n    ]\n    if secure:\n        events.append(\"TLS handshake\"\
    )\n    events.extend([\"HTTP request\", \"HTTP response\"])\n    return events"
  packages: []
  topic: 1. Networking Fundamentals
  wrong_solutions:
  - "def http_request_trace(host: str, secure: bool) -> list[str]:\n    \"\"\"Return the ordered DNS, connection,\
    \ and HTTP events for a request.\"\"\"\n    events = [f\"DNS lookup: {host}\", \"TCP SYN\", \"TCP SYN-ACK\"\
    , \"TCP ACK\", \"HTTP request\", \"HTTP response\"]\n    return events"
  - "def http_request_trace(host: str, secure: bool) -> list[str]:\n    \"\"\"Return the ordered DNS, connection,\
    \ and HTTP events for a request.\"\"\"\n    events = [f\"DNS lookup: {host}\", \"TCP SYN\", \"TCP SYN-ACK\"\
    , \"HTTP request\", \"HTTP response\"]\n    if secure:\n        events.insert(3, \"TLS handshake\")\n    return\
    \ events"
  - "def http_request_trace(host: str, secure: bool) -> list[str]:\n    \"\"\"Return the ordered DNS, connection,\
    \ and HTTP events for a request.\"\"\"\n    events = [\"TCP SYN\", \"TCP SYN-ACK\", \"TCP ACK\"]\n    if secure:\n\
    \        events.append(\"TLS handshake\")\n    events.extend([\"HTTP request\", \"HTTP response\"])\n    return\
    \ events"
problems:
- title: Build Runtime Configuration
  prompt: "Write `build_runtime_config(defaults, environment, backing_services)` to prepare configuration for a\
    \ disposable, stateless service process.\n\nReturn a new dictionary with exactly two keys: `settings` and `backing_services`.\
    \ Start `settings` with all entries from `defaults`, then override a setting only when `environment` contains\
    \ the same key. Ignore environment keys that are not present in `defaults`. Copy `backing_services` into the\
    \ result unchanged; these bindings represent externally supplied backing services rather than hardcoded dependencies.\
    \ Do not modify any input. Each call must be independent, so creating or changing one result cannot affect later\
    \ calls.\n\nFor example:\n\n```python\nbuild_runtime_config(\n    {\"PORT\": \"8000\", \"LOG_LEVEL\": \"info\"\
    },\n    {\"PORT\": \"9000\", \"UNUSED\": \"x\"},\n    {\"database\": \"postgres://db\"},\n)\n```\n\nreturns:\n\
    \n```python\n{\n    \"settings\": {\"PORT\": \"9000\", \"LOG_LEVEL\": \"info\"},\n    \"backing_services\":\
    \ {\"database\": \"postgres://db\"},\n}\n```"
  starter_code: "def build_runtime_config(defaults, environment, backing_services):\n    \"\"\"Build independent\
    \ runtime settings and backing-service bindings.\"\"\"\n    ..."
  tests: 'defaults = {"PORT": "8000", "LOG_LEVEL": "info", "FEATURE_X": "off"}

    environment = {"PORT": "9000", "LOG_LEVEL": "debug", "UNUSED": "x"}

    services = {"database": "postgres://db", "cache": "redis://cache"}

    config = build_runtime_config(defaults, environment, services)

    assert config == {"settings": {"PORT": "9000", "LOG_LEVEL": "debug", "FEATURE_X": "off"}, "backing_services":
    services}, "overrides should retain defaults and include service bindings"

    assert "UNUSED" not in config["settings"], "unknown environment keys should be ignored"

    assert defaults == {"PORT": "8000", "LOG_LEVEL": "info", "FEATURE_X": "off"}, "defaults must not be modified"

    assert environment == {"PORT": "9000", "LOG_LEVEL": "debug", "UNUSED": "x"}, "environment must not be modified"

    assert services == {"database": "postgres://db", "cache": "redis://cache"}, "service bindings must not be modified"

    config["settings"]["PORT"] = "changed"

    config["backing_services"]["database"] = "changed"

    again = build_runtime_config(defaults, environment, services)

    assert again["settings"]["PORT"] == "9000", "a result must not affect a later call"

    assert again["backing_services"]["database"] == "postgres://db", "returned bindings must be independent copies"

    assert build_runtime_config({"MODE": "prod"}, {}, {}) == {"settings": {"MODE": "prod"}, "backing_services":
    {}}, "empty overrides and bindings should preserve defaults"'
  solution: "def build_runtime_config(defaults, environment, backing_services):\n    \"\"\"Build independent runtime\
    \ settings and backing-service bindings.\"\"\"\n    settings = dict(defaults)\n    for key, value in environment.items():\n\
    \        if key in defaults:\n            settings[key] = value\n    return {\n        \"settings\": settings,\n\
    \        \"backing_services\": dict(backing_services),\n    }"
  packages: []
  topic: 2. Architecture Principles
  wrong_solutions:
  - "def build_runtime_config(defaults, environment, backing_services):\n    \"\"\"Build independent runtime settings\
    \ and backing-service bindings.\"\"\"\n    return {\"settings\": dict(defaults), \"backing_services\": dict(backing_services)}"
  - "def build_runtime_config(defaults, environment, backing_services):\n    \"\"\"Build independent runtime settings\
    \ and backing-service bindings.\"\"\"\n    return {\"settings\": dict(environment), \"backing_services\": dict(backing_services)}"
  - "def build_runtime_config(defaults, environment, backing_services):\n    \"\"\"Build independent runtime settings\
    \ and backing-service bindings.\"\"\"\n    settings = defaults\n    settings.update(environment)\n    return\
    \ {\"settings\": settings, \"backing_services\": backing_services}"
- title: Build a Versioned REST Handler
  prompt: 'Write `handle_request(method, path, body, items)` to emulate a small versioned REST API for widgets.
    Return a tuple `(status_code, response_body, updated_items)`.


    The API has these routes:

    - `GET /api/v1/widgets` returns status `200` and all items.

    - `POST /api/v1/widgets` creates an item from `body["name"]`, returns status `201` and the created item, and
    appends it to the returned item list. Assign the new item an `id` one greater than the largest existing ID,
    or `1` when the list is empty.

    - `GET /api/v1/widgets/{id}` returns status `200` and the matching item, or status `404` and `None` if it does
    not exist.

    - `DELETE /api/v1/widgets/{id}` removes the matching item and returns status `204` and `None`, or returns status
    `404` and `None` if it does not exist.

    - A recognized route with an unsupported method returns `405` and `None`. An unrecognized path or API version
    returns `404` and `None`.


    Assume POST bodies contain a `name` field, IDs in `items` are integers, and item IDs in paths are decimal integers.
    Do not modify the input list.


    Example:

    ```python

    handle_request("POST", "/api/v1/widgets", {"name": "lamp"}, [{"id": 2, "name": "chair"}])

    ```

    returns:

    ```python

    (201, {"id": 3, "name": "lamp"}, [{"id": 2, "name": "chair"}, {"id": 3, "name": "lamp"}])

    ```'
  starter_code: "def handle_request(method, path, body, items):\n    \"\"\"Emulate one request to the versioned\
    \ widgets API.\"\"\"\n    ..."
  tests: 'items = [{"id": 2, "name": "chair"}, {"id": 5, "name": "desk"}]

    assert handle_request("GET", "/api/v1/widgets", None, items) == (200, items, items), "GET collection returns
    all items"

    assert handle_request("GET", "/api/v1/widgets/5", None, items) == (200, items[1], items), "GET item returns
    the matching item"

    assert handle_request("GET", "/api/v1/widgets/8", None, items) == (404, None, items), "Missing item returns
    404"

    created = {"id": 6, "name": "lamp"}

    assert handle_request("POST", "/api/v1/widgets", {"name": "lamp"}, items) == (201, created, items + [created]),
    "POST uses the next ID and returns 201"

    first = {"id": 1, "name": "lamp"}

    assert handle_request("POST", "/api/v1/widgets", {"name": "lamp"}, []) == (201, first, [first]), "POST to an
    empty collection starts at ID 1"

    assert handle_request("DELETE", "/api/v1/widgets/2", None, items) == (204, None, [items[1]]), "DELETE removes
    an existing item"

    assert handle_request("PUT", "/api/v1/widgets", None, items) == (405, None, items), "Unsupported method on a
    known route returns 405"

    assert handle_request("GET", "/api/v2/widgets", None, items) == (404, None, items), "Unknown API version returns
    404"'
  solution: "def handle_request(method, path, body, items):\n    parts = path.strip(\"/\").split(\"/\")\n    collection_route\
    \ = parts == [\"api\", \"v1\", \"widgets\"]\n    item_id = None\n\n    if len(parts) == 4 and parts[:3] == [\"\
    api\", \"v1\", \"widgets\"] and parts[3].isdecimal():\n        item_id = int(parts[3])\n        item_route =\
    \ True\n    else:\n        item_route = False\n\n    if not collection_route and not item_route:\n        return\
    \ 404, None, items\n\n    if collection_route:\n        if method == \"GET\":\n            return 200, list(items),\
    \ items\n        if method == \"POST\":\n            new_id = max((item[\"id\"] for item in items), default=0)\
    \ + 1\n            created = {\"id\": new_id, \"name\": body[\"name\"]}\n            return 201, created, items\
    \ + [created]\n        return 405, None, items\n\n    if method == \"GET\":\n        for item in items:\n  \
    \          if item[\"id\"] == item_id:\n                return 200, item, items\n        return 404, None, items\n\
    \n    if method == \"DELETE\":\n        for index, item in enumerate(items):\n            if item[\"id\"] ==\
    \ item_id:\n                return 204, None, items[:index] + items[index + 1:]\n        return 404, None, items\n\
    \n    return 405, None, items"
