  text: An API receives a valid request for an item ID that does not exist. Which HTTP response is the most appropriate?
  options:
  - '`200 OK`, because the server processed the request'
  - '`301 Moved Permanently`, because the item is unavailable'
  - '`503 Service Unavailable`, because no matching item exists'
  - '`404 Not Found`, because the requested item is absent'
  answer: 3
  explanation: '`404 Not Found` indicates that the server could not find the requested resource. A `503` instead
