    \ format_fuel_level(\"1/100\") == \"E\", \"low rounded percentage\"\nassert format_fuel_level(\"99/100\") ==\
    \ \"F\", \"high rounded percentage\"\nassert format_fuel_level(\"197/200\") == \"F\", \"ties round up before\
    \ applying the full threshold\"\n\nfor invalid_fraction in (\"5/4\", \"1/0\", \"abc\"):\n    try:\n        format_fuel_level(invalid_fraction)\n\
