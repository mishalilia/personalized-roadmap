problems:
- title: Summarize Readings
  prompt: 'Write `summarize_readings(readings)`, a pure function that summarizes a list of numeric readings. This
    is a one-shot calculation with no state, so use a function rather than a class. Use meaningful names and a docstring
    that describes the input, returned values, and empty-list behavior. Do not print or modify the input.


    Return a dictionary with `count`, `minimum`, `maximum`, and `mean`. For an empty list, return a count of `0`
    and `None` for the other values. Assume readings are valid numbers; input validation is not required.


    Example:

    ```python

    summarize_readings([4, 2, 8])

    # {''count'': 3, ''minimum'': 2, ''maximum'': 8, ''mean'': 14 / 3}

    ```'
  starter_code: "def summarize_readings(readings):\n    \"\"\"Summarize numeric readings without changing the input\
    \ list.\n\n    Return a dictionary with count, minimum, maximum, and mean. For an\n    empty list, return a\
    \ count of 0 and None for the other values.\n    \"\"\"\n    ..."
  tests: 'summary = summarize_readings([4, 2, 8])

    assert summary == {"count": 3, "minimum": 2, "maximum": 8, "mean": 14 / 3}, "summarize a typical list"

    assert summarize_readings([7]) == {"count": 1, "minimum": 7, "maximum": 7, "mean": 7.0}, "handle one reading"

    assert summarize_readings([]) == {"count": 0, "minimum": None, "maximum": None, "mean": None}, "handle an empty
    list"

    assert summarize_readings([0, -2]) == {"count": 2, "minimum": -2, "maximum": 0, "mean": -1.0}, "handle zero
    and negative readings"

    assert summarize_readings([1, 2])["mean"] == 1.5, "preserve a fractional mean"

    readings = [3, 1, 2]

    summarize_readings(readings)

    assert readings == [3, 1, 2], "leave the input list unchanged"'
  solution: "def summarize_readings(readings):\n    \"\"\"Summarize numeric readings without changing the input\
    \ list.\n\n    Return a dictionary with count, minimum, maximum, and mean. For an\n    empty list, return a\
    \ count of 0 and None for the other values.\n    \"\"\"\n    count = len(readings)\n    if count == 0:\n   \
    \     return {\n            \"count\": 0,\n            \"minimum\": None,\n            \"maximum\": None,\n\
    \            \"mean\": None,\n        }\n\n    total = sum(readings)\n    return {\n        \"count\": count,\n\
    \        \"minimum\": min(readings),\n        \"maximum\": max(readings),\n        \"mean\": total / count,\n\
    \    }"
