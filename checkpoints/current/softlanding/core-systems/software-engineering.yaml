    \ records that have already been loaded; it must not read files, print output, or rely on global state.\n\n\
    Each record is a dictionary with `model` (a string), `input_tokens` (an integer), and `output_tokens` (an integer).\
    \ Assume records are well-formed. Return a list with one dictionary per distinct model, in the order each model\
    \ first appears. Each summary dictionary must contain `model`, `requests` (the number of that model's input\
    \ records), `input_tokens` (the sum), and `output_tokens` (the sum). Do not modify the input records. A record\
    \ with zero tokens still counts as a request.\n\nExample:\n\n```python\nrecords = [\n    {\"model\": \"cedar\"\
    , \"input_tokens\": 12, \"output_tokens\": 3},\n    {\"model\": \"maple\", \"input_tokens\": 5, \"output_tokens\"\
    : 2},\n    {\"model\": \"cedar\", \"input_tokens\": 4, \"output_tokens\": 6},\n]\nsummarize_usage(records)\n\
    ```\n\nResult:\n\n```python\n[\n    {\"model\": \"cedar\", \"requests\": 2, \"input_tokens\": 16, \"output_tokens\"\
    : 9},\n    {\"model\": \"maple\", \"requests\": 1, \"input_tokens\": 5, \"output_tokens\": 2},\n]\n```"
