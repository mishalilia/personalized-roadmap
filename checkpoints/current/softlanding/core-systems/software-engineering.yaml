problem:
  title: Format a Fuel Gauge
  prompt: 'Write a pure function `format_fuel_level(fraction)` that converts a fraction string into a fuel-gauge
    display.


    Requirements:

    - Accept a string containing exactly two nonnegative base-10 integers separated by one `/` (for example, `"3/4"`).

    - Raise `ValueError` if the input has the wrong format, the denominator is zero, or the numerator is greater
    than the denominator.

    - Convert the fraction to a whole-number percentage, rounding to the nearest integer with ties rounded up.

    - Return `"E"` if the rounded percentage is 1 or less, `"F"` if it is 99 or more, and otherwise return the percentage
    followed by `%`.


    For example, `format_fuel_level("3/4")` returns `"75%"`.'
  starter_code: "def format_fuel_level(fraction: str) -> str:\n    \"\"\"Convert a valid fuel fraction string to\
    \ a gauge display.\n\n    Raise ValueError for malformed fractions or fractions outside 0 to 1.\n    \"\"\"\n\
    \    ..."
  tests: "assert format_fuel_level(\"3/4\") == \"75%\", \"ordinary percentage\"\nassert format_fuel_level(\"1/6\"\
    ) == \"17%\", \"round to nearest integer\"\nassert format_fuel_level(\"0/8\") == \"E\", \"zero fuel\"\nassert\
    \ format_fuel_level(\"1/100\") == \"E\", \"low rounded percentage\"\nassert format_fuel_level(\"99/100\") ==\
    \ \"F\", \"high rounded percentage\"\nassert format_fuel_level(\"197/200\") == \"F\", \"ties round up before\
    \ applying the full threshold\"\n\nfor invalid_fraction in (\"5/4\", \"1/0\", \"abc\"):\n    try:\n        format_fuel_level(invalid_fraction)\n\
    \    except ValueError:\n        pass\n    else:\n        assert False, f\"invalid fraction should raise ValueError:\
    \ {invalid_fraction!r}\""
  solution: "def format_fuel_level(fraction: str) -> str:\n    \"\"\"Convert a valid fuel fraction string to a gauge\
    \ display.\n\n    Raise ValueError for malformed fractions or fractions outside 0 to 1.\n    \"\"\"\n    if\
    \ not isinstance(fraction, str):\n        raise ValueError(\"fraction must be a string\")\n\n    parts = fraction.split(\"\
    /\")\n    if len(parts) != 2 or any(\n        not part or any(character < \"0\" or character > \"9\" for character\
    \ in part)\n        for part in parts\n    ):\n        raise ValueError(\"fraction must contain two nonnegative\
    \ integers separated by '/'\")\n\n    numerator, denominator = (int(part) for part in parts)\n    if denominator\
    \ == 0:\n        raise ValueError(\"denominator must not be zero\")\n    if numerator > denominator:\n     \
    \   raise ValueError(\"numerator must not exceed denominator\")\n\n    percentage = (200 * numerator + denominator)\
    \ // (2 * denominator)\n    if percentage <= 1:\n        return \"E\"\n    if percentage >= 99:\n        return\
    \ \"F\"\n    return f\"{percentage}%\""
  packages: []
  topic: 2. Testing and debugging
  wrong_solutions:
  - "def format_fuel_level(fraction: str) -> str:\n    numerator, denominator = (int(part) for part in fraction.split(\"\
    /\"))\n    percentage = 100 * numerator // denominator\n    if percentage <= 1:\n        return \"E\"\n    if\
    \ percentage >= 99:\n        return \"F\"\n    return f\"{percentage}%\""
  - "def format_fuel_level(fraction: str) -> str:\n    numerator, denominator = (int(part) for part in fraction.split(\"\
    /\"))\n    percentage = (200 * numerator + denominator) // (2 * denominator)\n    return f\"{percentage}%\""
  - "def format_fuel_level(fraction: str) -> str:\n    parts = fraction.split(\"/\")\n    if len(parts) != 2:\n\
    \        raise ValueError(\"invalid fraction\")\n    numerator, denominator = (int(part) for part in parts)\n\
    \    if denominator == 0:\n        raise ValueError(\"denominator must not be zero\")\n    percentage = (200\
    \ * numerator + denominator) // (2 * denominator)\n    if percentage <= 1:\n        return \"E\"\n    if percentage\
    \ >= 99:\n        return \"F\"\n    return f\"{percentage}%\""
problems:
- title: Summarize Readings
  prompt: 'Write `summarize_readings(readings)`, a pure function that summarizes a list of numeric readings. This
    is a one-shot calculation with no state, so use a function rather than a class. Use meaningful names and a docstring
    that describes the input, returned values, and empty-list behavior. Do not print or modify the input.


    Return a dictionary with `count`, `minimum`, `maximum`, and `mean`. For an empty list, return a count of `0`
    and `None` for the other values. Assume readings are valid numbers; input validation is not required.


    Example:

    ```python

    summarize_readings([4, 2, 8])

    # {''count'': 3, ''minimum'': 2, ''maximum'': 8, ''mean'': 14 / 3}

    ```'
  starter_code: "def summarize_readings(readings):\n    \"\"\"Summarize numeric readings without changing the input\
    \ list.\n\n    Return a dictionary with count, minimum, maximum, and mean. For an\n    empty list, return a\
    \ count of 0 and None for the other values.\n    \"\"\"\n    ..."
  tests: 'summary = summarize_readings([4, 2, 8])

    assert summary == {"count": 3, "minimum": 2, "maximum": 8, "mean": 14 / 3}, "summarize a typical list"

    assert summarize_readings([7]) == {"count": 1, "minimum": 7, "maximum": 7, "mean": 7.0}, "handle one reading"

    assert summarize_readings([]) == {"count": 0, "minimum": None, "maximum": None, "mean": None}, "handle an empty
    list"

    assert summarize_readings([0, -2]) == {"count": 2, "minimum": -2, "maximum": 0, "mean": -1.0}, "handle zero
    and negative readings"

    assert summarize_readings([1, 2])["mean"] == 1.5, "preserve a fractional mean"

    readings = [3, 1, 2]

    summarize_readings(readings)

    assert readings == [3, 1, 2], "leave the input list unchanged"'
  solution: "def summarize_readings(readings):\n    \"\"\"Summarize numeric readings without changing the input\
    \ list.\n\n    Return a dictionary with count, minimum, maximum, and mean. For an\n    empty list, return a\
    \ count of 0 and None for the other values.\n    \"\"\"\n    count = len(readings)\n    if count == 0:\n   \
    \     return {\n            \"count\": 0,\n            \"minimum\": None,\n            \"maximum\": None,\n\
    \            \"mean\": None,\n        }\n\n    total = sum(readings)\n    return {\n        \"count\": count,\n\
    \        \"minimum\": min(readings),\n        \"maximum\": max(readings),\n        \"mean\": total / count,\n\
    \    }"
