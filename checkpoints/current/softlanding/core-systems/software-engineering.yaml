  topic: 1. Readable Python
  text: A function uses a notebook variable named `threshold` that is set in an earlier cell. What change makes
    the function's behavior explicit and avoids dependence on execution order?
  options:
  - Set `threshold` inside the function to the value used by the notebook.
  - Rename the notebook variable so it is easy to find before running the function.
  - Pass `threshold` as a function argument and document what values it accepts.
  - Add a comment saying the function expects `threshold` to exist globally.
  answer: 2
  explanation: Passing the threshold as an argument makes the function's dependency visible at its call site and
    avoids relying on a notebook's hidden state.
