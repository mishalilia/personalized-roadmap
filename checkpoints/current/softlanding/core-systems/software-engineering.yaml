questions:
- id: q1
  topic: 1. Readable Python
  text: A function currently loads a CSV, filters rows, computes a total, and prints the result. Which change would
    make it easiest to reuse the calculation in a different program?
  options:
  - Keep the function together and add an argument that selects where it prints the total.
  - Move the filtering and calculation into a function that accepts rows and returns the total.
  - Store the rows in a module-level variable so the calculation can be called from anywhere.
  - Add more comments describing each step, but leave the loading and printing in the function.
  answer: 1
  explanation: A function that accepts its data and returns a result has a clear responsibility and can be reused
    without requiring a particular input source or output destination.
