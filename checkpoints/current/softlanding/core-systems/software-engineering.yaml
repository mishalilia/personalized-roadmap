problem:
  title: Summarize numeric readings
  prompt: 'Implement `summarize_readings(values)` to return a dictionary with the number of readings (`count`),
    the smallest reading (`min`), the largest reading (`max`), and their arithmetic mean (`mean`). The input must
    be a non-empty list of finite numbers; raise `ValueError` for an empty list or a non-finite value, and `TypeError`
    for a value that is not a number (booleans do not count as numbers here).


    For example, `summarize_readings([2, 4])` should return `{"count": 2, "min": 2, "max": 4, "mean": 3.0}`.'
  starter_code: "def summarize_readings(values):\n    \"\"\"Return count, minimum, maximum, and mean for finite\
    \ numeric readings.\"\"\"\n    ..."
  tests: "assert summarize_readings([2, 4]) == {\"count\": 2, \"min\": 2, \"max\": 4, \"mean\": 3.0}, \"summarize\
    \ two readings\"\nassert summarize_readings([-3]) == {\"count\": 1, \"min\": -3, \"max\": -3, \"mean\": -3.0},\
    \ \"summarize one reading\"\nassert summarize_readings([1.5, 2.5, 6.0])[\"mean\"] == 10 / 3, \"compute the arithmetic\
    \ mean\"\ntry:\n    summarize_readings([])\nexcept ValueError:\n    pass\nelse:\n    assert False, \"empty input\
    \ should raise ValueError\"\ntry:\n    summarize_readings([1, float(\"inf\")])\nexcept ValueError:\n    pass\n\
    else:\n    assert False, \"non-finite readings should raise ValueError\"\ntry:\n    summarize_readings([1, \"\
    2\"])\nexcept TypeError:\n    pass\nelse:\n    assert False, \"non-numeric readings should raise TypeError\"\
    \ntry:\n    summarize_readings([True])\nexcept TypeError:\n    pass\nelse:\n    assert False, \"booleans should\
    \ raise TypeError\""
  solution: "import math\n\n\ndef summarize_readings(values):\n    \"\"\"Return count, minimum, maximum, and mean\
    \ for finite numeric readings.\"\"\"\n    if not values:\n        raise ValueError(\"values must not be empty\"\
    )\n\n    for value in values:\n        if isinstance(value, bool) or not isinstance(value, (int, float)):\n\
    \            raise TypeError(\"readings must be numbers\")\n        if not math.isfinite(value):\n         \
    \   raise ValueError(\"readings must be finite\")\n\n    return {\n        \"count\": len(values),\n       \
    \ \"min\": min(values),\n        \"max\": max(values),\n        \"mean\": sum(values) / len(values),\n    }"
  packages: []
