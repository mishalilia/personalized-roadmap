# Model providers with an OpenAI-compatible API. Keys stay in .env: LLM_API_KEY_OPENAI, LLM_API_KEY_GOOGLE,
# LLM_API_KEY_GROQ. LLM_PROVIDER (or --provider on the command line) picks one; without it, the first one here
# with a key is used. A provider's models are tried in order. Why this order: Q-003 in docs/questions.md.

openai:
  base_url: https://api.openai.com/v1
  models: [gpt-6-luna]

google:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  models: [gemini-3.5-flash-lite, gemini-3.8-flash]

groq:
  base_url: https://api.groq.com/openai/v1
  models: [openai/gpt-oss-120b]
