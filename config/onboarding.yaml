# Onboarding questions. Most are answered by choosing, with optional details in the learner's own words; one
# short code question shows what the learner can read rather than what they say; the goal is written freely,
# because goals cannot be listed in advance. The options describe what the learner has done rather than how
# they rate themselves, because self-reported level is unreliable in both directions.
#
# kind: single (one option), multiple (any number), check (one option, `correct` is the right one and is never
# sent to the browser), text (written freely). For choice questions `placeholder` hints at the details.

questions:
  - id: programming
    kind: single
    text: How much have you programmed?
    options:
      - {id: none, label: I have not programmed yet}
      - {id: course, label: "In a course or class, nothing of my own yet"}
      - {id: under_year, label: "Under a year, including programs of my own"}
      - {id: one_to_three, label: 1–3 years}
      - {id: over_three, label: More than 3 years}
    placeholder: "Optional: which languages, and where — study, hobby, job."

  - id: hardest_project
    kind: single
    text: What is the most complex thing you have built?
    options:
      - {id: nothing, label: Nothing yet}
      - {id: guided, label: "Exercises, or a project following a course's instructions"}
      - {id: own_small, label: A small program or script of my own}
      - {id: app, label: An application with a database or an API}
      - {id: production, label: A system other people use in production}
    placeholder: "Optional: what it was, your part in it, and what was hard."

  - id: math
    kind: single
    text: Linear algebra, probability and statistics — where are you with them?
    options:
      - {id: school, label: School maths only}
      - {id: faded, label: "I studied them, but it has faded"}
      - {id: comfortable, label: "I studied them and still use them"}
    placeholder: "Optional: where you learned them, and when you last used them."

  - id: tools
    kind: multiple
    text: Which of these have you used in practice?
    options:
      - {id: command_line, label: The command line}
      - {id: git, label: Git}
      - {id: sql, label: SQL}
      - {id: docker, label: Docker}
      - {id: cloud, label: "A cloud provider (AWS, Google Cloud, Azure)"}
      - {id: none, label: None of these}
    placeholder: "Optional: how you used them, e.g. Git every day, SQL for reports."

  - id: machine_learning
    kind: single
    text: Have you trained or used machine-learning models?
    options:
      - {id: none, label: "No"}
      - {id: theory, label: "I know the ideas from reading or lectures"}
      - {id: tutorial, label: Trained models in a course or tutorial}
      - {id: project, label: "Trained or deployed models in a project or at work"}
    placeholder: "Optional: what you did, e.g. a scikit-learn classifier in a course project."

  - id: code_check
    kind: check
    text: What does this code print?
    code: |
      scores = {"ann": 3, "bob": 5}
      ranked = sorted(scores, key=scores.get,
                      reverse=True)
      print(*ranked)
    options:
      - {id: a, label: ann bob}
      - {id: b, label: bob ann}
      - {id: c, label: 5 3}
      - {id: d, label: "An error: a dictionary cannot be sorted"}
    correct: b

  - id: goal
    kind: text
    text: What do you want to be able to do when you finish? Be as specific as you can.
    placeholder: e.g. Build and deploy image-recognition models for quality control in manufacturing.
